name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Validate content, types, lint, and a production build on every change, then
# run the Playwright browser + visual checks. A content change to a page plan
# or content file therefore triggers a fresh, validated static build.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Visual + browser tests
        run: npm run test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-screenshots
          path: tests/visual/screenshots/
          if-no-files-found: warn
