# ai-ops-secret-scan.yml — supply-chain дочки: поиск секретов в коде и истории.
# Ставится `ai-ops init` в .github/workflows/ (или скопируйте вручную). Опт-аут: удалить этот файл.
#
# ДВА УРОВНЯ ЗАЩИТЫ ОТ СЕКРЕТОВ, и этот шаблон — второй.
#   1. GitHub Secret Scanning + Push Protection — НАСТРОЙКА РЕПОЗИТОРИЯ, а не файл: включается в
#      Settings -> Code security (публичным репозиториям бесплатно; приватным нужен GitHub Advanced
#      Security). Push protection блокирует пуш с секретом ДО того, как он попал в историю. Как
#      включить — в SUPPLY-CHAIN.md. Файлом это не поставить, поэтому кит только называет шаг.
#   2. Этот workflow (gitleaks) — ПОРТИРУЕМЫЙ бэкстоп: работает и там, где нативного секрет-сканера
#      нет, и на self-hosted. Он ловит уже закоммиченное, тогда как push protection не даёт закоммитить.
#
# ADVISORY ПО УМОЛЧАНИЮ. `continue-on-error: true` — находка не роняет PR, только сообщает. Сделать
# проверку БЛОКИРУЮЩЕЙ можно, убрав эту строку, — но лишь после того, как поток ложных на вашем
# репозитории обнулён (инвариант: блокирующей делаем только с нулём ложных). Секрет-сканеры шумят на
# тестовых фикстурах и примерах — сперва настройте `.gitleaks.toml` allowlist, потом ужесточайте.
#
# ГРАНИЦА С ИНВАРИАНТОМ КИТА. Фордж-конфигурация дочки; рантайм-зависимостей у инструментов кита не добавляет.
#
# ПИНЫ. Действия по мажорному тегу; для Pinned-Dependencies закрепите на commit SHA (см. SUPPLY-CHAIN.md).
name: ai-ops-secret-scan
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  # Отменять УСТАРЕВШИЕ прогоны — но ТОЛЬКО для PR (новый пуш в тот же PR гасит прежний).
  # На push в main / schedule / release / record отмена НЕ применяется: там каждый прогон
  # относится к своему коммиту/событию, и его потеря = дыра в проверке или в записи.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # нужна вся история: секрет мог осесть в прошлом коммите
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # ADVISORY: снимите строку, когда ложных ноль (см. шапку)
        env:
          # GITLEAKS_LICENSE нужен gitleaks-action только организациям; для одиночного репо не требуется.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
