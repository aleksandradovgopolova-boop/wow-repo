# ai-ops-manifest.yaml — central manifest пакета AI-first системы
# Bootstrap v0.1.0 (первый change package: structured registry + manifest).
# Аддитивно: тела агентов/workflow не менялись, файлы не перемещались.
# Полная целевая архитектура — audit/ai-ops-target-v2/.
schema_version: 1
kind: ai-ops-manifest

ai_ops:
  package_version: 3.39.0
  schema_version: 1
  minimum_runtime_contract: 1

spec_protocol:
  engine: openspec
  version_range: ">=1.5.0 <2.0.0"          # проверено на 1.5.0 (openspec validate --strict)
  dependency_strategy: cli-and-protocol      # вызываем CLI + читаем markdown; не импорт
  status: integrated
  enabled_by_default: true                   # включено по умолчанию; выключается в child флагом openspec.enabled
  opt_out_flag: ".ai-ops.yaml -> openspec.enabled: false"
  requires_runtime: node                      # для не-Node репо — контейнер/вложенный CLI
  deterministic_operations: [validate, archive, sync]   # выполняет CLI, не LLM
  extension_schemas: [openspec/schemas/product, openspec/schemas/research]
  change_template: openspec/change-template/
  example: examples/openspec-demo/            # проходит openspec validate --all --strict
  parallel_merge_guard: ai_ops_kit/validation/validate_openspec_change.py
  fallback: [pin-version, fork-mit, our-format-validator]

registries:
  agents: registry/agents.yaml
  workflows: registry/workflows.yaml          # MVP: QUICK/ENGINEERING/PRODUCT/RESEARCH
  quality_gates: quality/gates.yaml           # единый gate registry
  capability_index: registry/capability-index.yaml
  routing: config/model-routing.yaml          # расширяется на Ф6
  entities: registry/entities.yaml            # Knowledge Graph: типы и связи (v2.0)
  skills_catalog: registry/skills-catalog.yaml # v2.12: внешние скиллы (declared), ставятся на уровне child

workflows:
  mvp: [QUICK, ENGINEERING, PRODUCT, RESEARCH]
  extended: [VISUAL, ANALYTICS, INSIGHTS, ADOPTION, AI_FEATURE, DECISION, CRITICAL]   # v1.3 + v2.0 + v2.1 + AI Product Pack (v2.4) + Decision Intelligence (v2.10) + CRITICAL (цель critical-эскалации)

skills:
  # Скиллы, которые поставляет сам кит (грузятся в .claude/skills/ у child).
  # Первый — v2.7. Внешний deep-research остаётся встроенным скиллом раннера.
  shipped:
    - id: product-session-review        # v2.7, opt-in; used_by INSIGHTS.data-collection, user-researcher
      path: skills/product-session-review/SKILL.md
      opt_in: true
      checklist: rules/research/session-review.yaml
    - id: system-constraint-analysis    # v2.8, opt-in; used_by INSIGHTS.insight-synthesis, product-analyst
      path: skills/system-constraint-analysis/SKILL.md
      opt_in: true
      checklist: rules/thinking/constraint-analysis.yaml
    - id: contradiction-resolution      # v2.8, opt-in; used_by PRODUCT.specification, solution-architect
      path: skills/contradiction-resolution/SKILL.md
      opt_in: true
      checklist: rules/thinking/contradiction-resolution.yaml
    - id: decision-support              # v2.10, opt-in; used_by workflow DECISION, product-manager/product-reviewer
      path: skills/decision-support/SKILL.md
      opt_in: true
      checklist: rules/thinking/decision-support.yaml
    - id: frontend-design               # v2.11, opt-in; used_by VISUAL (ux-flow/implementation), ui-ux-designer
      path: skills/frontend-design/SKILL.md
      opt_in: true
      checklist: rules/design/frontend-design.yaml
    - id: e2e-browser-testing           # v2.11, opt-in; used_by verify (VISUAL/PRODUCT/ENGINEERING/AI_FEATURE)
      path: skills/e2e-browser-testing/SKILL.md
      opt_in: true
      checklist: rules/quality/e2e-baseline.yaml
    - id: user-documentation            # v2.13, opt-in; used_by ADOPTION.user-docs, documentation-steward
      path: skills/user-documentation/SKILL.md
      opt_in: true
      checklist: rules/documentation/user-docs.yaml
    - id: product-demo-video            # v2.13, opt-in; used_by ADOPTION.adoption-plan; захват на Playwright
      path: skills/product-demo-video/SKILL.md
      opt_in: true
      checklist: rules/content/demo-video.yaml
    - id: repo-onboarding               # v2.22, opt-in; первичный онбординг репо -> черновики context/*
      path: skills/repo-onboarding/SKILL.md
      opt_in: true
      checklist: rules/meta/repo-onboarding.yaml
    - id: plain-language-communication  # v3.35, НЕ opt-in: регулирует каждый ответ человеку
      path: skills/plain-language-communication/SKILL.md
      opt_in: false
      policy: registry/communication-policy.yaml
  authoring_convention: rules/meta/skill-authoring.yaml   # v2.11: конвенция авторинга (из skill-creator)

quality_gates:
  mvp_blocking: [intake_completeness, requirements, specification, plan_readiness,
                 implementation_verification, code_review, security, spec_synchronization]
  mvp_blocking_max: 8
  # Честность пути исполнения (self-audit v2.67): 7 из 8 MVP-blocking гейтов enforced per-task
  # gate_executor'ом через workflow.quality_gates/треки; spec_synchronization — детерминированный
  # OpenSpec-гейт, enforced OpenSpec CLI + ai_ops_kit/validation/validate_openspec_change.py в CI
  # (gate.enforced_by=openspec-ci-guard), НЕ per-task прогоном. validate_workflow_gates теперь
  # ERROR'ит недостижимый MVP-blocking гейт (orphan-guard), так что этот класс дрифта не повторится.
  enforced_by_ci_guard: [spec_synchronization, archive_readiness]
  count_pinned_by_claims: [gate-count, mvp-blocking-count]   # knowledge/claims.yaml (тип count)

agents:
  registered: 51             # 38 (v1.0) + 7 ревьюеров (v1.4) + 3 research-pack (v2.1) + 3 AI Product Pack (v2.4)
  core_target: 12            # целевой минимальный CORE после merge (Ф2-3)
  core_target_note: >
    В реестре 16 файлов с target_layer=core: 10 сохраняемых + 3 новых (create) + 3 merge-источника
    (repository-explorer, system-analyst, business-analyst). После merge источники схлопываются
    в context-builder и requirements-writer, давая итоговые 12 core-агентов.

providers:
  status: integrated          # Ф6: реестры + декларативный routing + self-test
  registry: registry/providers.yaml
  models: registry/models.yaml
  runtimes: registry/runtimes.yaml
  tools: registry/tools.yaml
  capability_index: registry/capability-index.yaml
  routing_policy: registry/routing-policy.yaml
  routing_engine: ai_ops_kit/engine/ai_route.py
  capability_selftest: ai_ops_kit/validation/ai_capability_selftest.py
  first_class: [anthropic, openai]
  live_executor_providers: [anthropic, openai, openai-compatible]  # v2.39: openai-compatible (DeepSeek/local) через OPENAI_COMPATIBLE_BASE_URL+ключ
  planned: [gigachat]         # опциональный провайдер на будущее (config-switch, без ключей сейчас)
  no_secrets: true            # только имена env-переменных / secret-reference

knowledge_integrity:
  # v2.9: drift-control (идея team-os-toolkit), наведённый сначала на сам пакет.
  status: integrated
  references_validator: ai_ops_kit/validation/validate_references.py    # uses_skills/checklist/owner/gate резолвятся
  claims: knowledge/claims.yaml                              # утверждения документации о коде
  claims_validator: ai_ops_kit/validation/validate_claims.py            # типы: file-exists, symbol-exists, enum-values, count (v2.67)
  python_compat_validator: ai_ops_kit/validation/validate_python_compat.py  # v2.69: PEP 604 union без future-import ломает <3.10
  freshness_policy: rules/core/FreshnessPolicy.md            # классы stable/evolving/volatile
  freshness_validator: ai_ops_kit/validation/validate_freshness.py
  gates: [knowledge_integrity, knowledge_freshness]           # non-blocking до обкатки
  child_claims_path: ".ai/project/knowledge/claims.yaml"      # где child хранит свои claims

execution_engine:
  # v2.31 Ф0 (correctness&safety) + v2.32 Ф1 (RunPlan + base_workflow/tracks).
  status: partial
  phase0_done: [ai-start-task-drift, security-in-engineering, ai_red_team-blocking, audit-log-redaction, per-workitem-state]
  run_plan:
    schema: schemas/run-plan.schema.json
    tool: tools/run_plan.py                 # plan (base_workflow + tracks -> gates) / validate
    tracks_registry: registry/tracks.yaml   # трек -> signal -> gates (Design/Analytics/Docs by Default)
    child_path: "features/<id>/run-plan.yaml"
  phase1_done: [run-plan-tracks, structured-reviewer-outputs, per-gate-evidence-schema]
  reviewer_result_schema: schemas/reviewer-result.schema.json   # источник истины вместо regex
  reviewer_result_validator: ai_ops_kit/validation/validate_reviewer_result.py
  project_detector:                         # v2.41 (P0#5 аудита): stack-aware evidence
    tool: tools/project_detector.py          # detect -> RepositoryProfile (стек, команды build/lint/test)
    schema: schemas/repository-profile.schema.json
    child_path: ".ai/project/RepositoryProfile.yaml"
    note: "детерминированно из манифестов; неопределённое -> undetermined; status draft (человек подтверждает)"
  evidence_collector:                       # v2.44: детерминированный stack-aware сбор evidence
    tool: tools/evidence_collector.py        # RepositoryProfile -> прогон команд через Broker -> gate evidence
    feeds_gate: implementation_verification  # по evidence_schema (build/lint/typecheck/tests)
    invariant: "вердикт = exit_code реальной команды (не LLM); в provided только реально прошедшие проверки"
    honesty: "команда не определена (None) -> not_run, флаг НЕ выдаётся; деструктивное отклоняет Policy"
  run_controller:                           # v2.34 Фаза 2 срез 1: единый вход задачи
    tool: tools/ai_ops_run.py                # route -> RunPlan -> WorkItem -> active-work -> exec -> report
    command: commands/task/ai-run.md
    execution: {claude-code: planned+scaffold (рантайм исполняет), generic-orchestrator: orchestrated}
  dogfood_findings:                         # v2.35: из обкатки 2.34 в ии-среде
    - planned-run НЕ материализует .ai/runtime/workitems/<id>/ (run_state — обещание пути; папку создаёт рантайм при исполнении) -> run_state_materialized в run-report
    - concurrency_preflight слеп к открытым PR без gh/токена (open_prs.status: unavailable) -> ЗАКРЫТО v2.43 REST-фоллбэком (токен из env)
    - child-CI пин kit в protected ci.yml давал трение на каждом update -> ai-ops-validate.yml: пин = installed_version из .ai-ops.yaml
  dogfood_findings_2026_07_16:              # из отчёта обкатки (кит 2.26->2.50, baseline_ready достигнут)
    - "#5 claude-code не копил историю (ad-hoc wi-<hash>) -> ЗАКРЫТО v2.51: ai-run --feature + честный док (авто только у generic-orchestrator)"
    - "#4 unknown task_type -> тяжёлый ENGINEERING для мелкой правки -> ЗАКРЫТО v2.52: size xs/small + low risk -> QUICK (ai_route)"
    - "#6 released без доказательства поставки (blueprint/reality дрейф) -> ЗАКРЫТО v2.52: validate_feature_blueprint требует хотя бы один done-артефакт при status=released"
  tool_broker:                              # v2.36 Фаза 2 срез 2: контролируемое исполнение
    tool: tools/tool_broker.py               # Policy(level/write_scope/protected) + execute + Evidence
    rule: rules/ai/ToolBrokerPolicy.md
    invariant: "execute() всегда через decide(); модель предлагает, политика решает"
    status: component-ready                  # компонент готов+тестирован; петля с живой моделью — след. шаг
    protected_paths_source: "MERGE: config/protected-paths.yaml (дефолт) + child .ai-ops.yaml protected_paths (v2.37)"
  execution_budget:                         # v2.38: жёсткий потолок прогона
    tool: tools/budget.py                    # Budget.from_dict(RunPlan.execution_budget); charge_call перед вызовом
    enforced: [max_model_calls]              # детерминировано
    declared_only: [max_cost, max_duration]  # нужен учёт токенов/времени на рантайме
    wired_into: tools/orchestrator.py        # превышение -> blocked + budget_exceeded
  tool_loop:                                # v2.42 Фаза 2 срез 3: tool-calling петля (механика)
    tool: tools/tool_loop.py                 # proposer -> Policy решает (Broker) -> Evidence -> обратно в контекст
    stop_conditions: [done, budget, max_steps]
    invariant: "запрещённое не исполняется, а возвращается модели как DENIED (само-коррекция)"
    status: component-ready                  # МЕХАНИКА детерминирована и тестируется offline (mock-предложитель)
    verified_offline: true                   # selftest: write в scope / denied вне scope / shell / done / budget / max_steps
    live_mechanics_verified: true            # v2.42 живой прогон на DeepSeek (openai-compatible): реальные JSON-предложения
    live_verified_evidence:                  #   распарсились и исполнились, denied=0 (scope соблюдён)
      provider: openai-compatible
      model: deepseek-chat
      run_v2_42_0: "task=создать src/add.py; 6/6 write, denied=0, stopped=budget — модель зациклилась на write"
      fix: "v2.42.1 усилил промпт предложителя (не повторять сделанное; после записи -> проверка -> done)"
      run_v2_42_2: "тот же task после фикса: write -> shell(проверка) -> done; steps=3, executed=2, denied=0, stopped=done"
    live_proposal_quality: verified          # v2.42.2: живая модель сходится (write->verify->done), не зацикливается
    live_path: "make_model_proposer(make_provider('openai-compatible', <model>)) — swap провайдера"
  phase2_done: [run-controller, tool-broker, execution-budget, tool-loop-live-verified]  # v2.42.2: петля подтверждена живьём
  phase3_done: [preflight-github-rest, stack-aware-evidence-collector]  # v2.43 + v2.44
  release_3_0:                              # docs/3.0-design.md; запускается по явному решению
    design: docs/3.0-design.md
    packages_declared: packages/            # v2.46 (срез 0): 5 деклараций границ, БЕЗ переноса файлов
    boundary_validator: ai_ops_kit/validation/validate_package_boundaries.py  # DAG + непересечение + резолв
    slice0_done: true                       # границы объявлены и стережутся валидатором
    slice1_done: true                       # v2.47: ai-run — канонический вход; ai-start-task — совместимый алиас
    canonical_entry: commands/task/ai-run.md  # генерируется в раннтайм (generate_runtime.render_ai_run)
    alias_retained: commands/task/ai-start-task.md  # снятие не раньше 4.0
    slice2_done: true                       # v2.48: по-пакетная установка (installer фильтрует managed_set)
    per_package_install:
      config_field: ".ai-ops.yaml -> packages: [список]"   # отсутствует -> все (обратная совместимость)
      rule: "неназначенный пакету файл ставится всегда (до физразноса); аддитивно"
    additive_complete: true                 # v2.49: срезы 0–2 дают всю пользу пакетов без переноса
    physical_split_deferred_to: "3.1"       # решение decisions ep-2026-07-16-tree-split
    deferral_reason: "перенос ломает CI-контракт установленных child (/tmp/ai-ops-kit/installer|validation пути); польза (гранулярная установка) уже дана; разнос оправдан только раздельной дистрибуцией (3.1)"
  not_yet:                                  # 3.1 (breaking) — при раздельной дистрибуции пакетов
    - "3.1: физический разнос дерева по packages/<name>/ + энтрипойнт-шимы + миграция child-CI + MIGRATION_GUIDE"

effect_metrics:
  # v2.30: автонакопление истории эффекта — чтобы baseline закрывался сам.
  status: integrated
  history_dir: ".ai/project/report-history"
  recorder: tools/run_report.py                      # --record: срез в историю
  metrics: tools/effect_metrics.py                   # baseline_ready при 3 фичах x >=3 срезов
  auto_record:
    in_session: [commands/task/ai-plan-task.md, commands/task/ai-implement.md, commands/task/ai-verify.md, commands/task/ai-finish-task.md]  # процедуры, где рантайм пишет срез
    ci_net: templates/ci/ai-ops-record.yml           # на push фиксирует срез по затронутым фичам
    feature_binding: "ai-run --feature <имя> (v2.51) — иначе wi-<hash>, срезы не копятся на фичу"
  by_runtime:                                        # ЧЕСТНО (finding обкатки): «авто» зависит от рантайма
    generic-orchestrator: "оркестратор кита пишет срезы сам при прогоне стадий"
    claude-code: "срез пишется, когда рантайм исполняет finish (run_report --record); автозаписи 'за стадию' нет — процедура, не магия"
  note: >
    Запись срезов даёт >=3 на фичу; полностью автоматично — только в generic-orchestrator.
    В claude-code история копится, когда рантайм честно исполняет finish на ИМЕНОВАННОЙ фиче
    (ad-hoc wi-<hash> baseline не двигает). CI-часть исполняет GitHub Actions; из среды
    разработки кита не проверялась.

event_contract:
  # v2.29: единый каталог имён событий — против contract<->code<->analytics drift.
  status: integrated
  schema: schemas/event-catalog.schema.json
  validator: ai_ops_kit/validation/validate_event_catalog.py   # + --scan по коду (best-effort)
  rule: rules/engineering/EventNamingConvention.md
  gate: event_contract_consistency                   # advisory до обкатки
  child_path: ".ai/project/contracts/events.yaml"
  example: examples/event-catalog-demo/events.yaml

governance:
  information_boundaries: governance/information-boundaries.md   # что можно/нельзя хранить (v2.9)

unified_product_path:
  # v2.17: единый продуктовый путь — одна сущность связывает два прежде раздельных
  # контура (прогон workflow и Feature Blueprint) одним id и одним статусом.
  status: integrated
  entity: tools/workitem.py                    # start (routing->blueprint->run) + status
  schema: schemas/workitem.schema.json
  entry_point: commands/task/ai-start-task.md  # единственная точка входа -> создаёт WorkItem
  record: "features/<id>/workitem.yaml"        # в child; один id = id фичи
  single_status: [done, blocked, needs_human_decision, needs_more_evidence]
  status_source: [tools/gate_executor.py, tools/run_report.py]   # детерминированный вывод

decision_intelligence:
  # v2.10: Decision Intelligence (идея team-os-toolkit init-team-decisions).
  status: integrated
  registry: decisions/registry.yaml                    # принципы + эпизоды + исходы
  schema: schemas/decisions-registry.schema.json
  validator: ai_ops_kit/validation/validate_decisions.py
  skill: skills/decision-support/SKILL.md              # recommendation-first + one-way-door
  workflow: DECISION
  gate: decision_quality                                # non-blocking до обкатки
  child_registry_path: ".ai/project/decisions/registry.yaml"

security_policies:
  permission_levels: security/permission-levels.yaml   # 6 уровней
  protected_paths: config/protected-paths.yaml
  boundary_model: security/boundary-model.md
  secrets_in_repo: forbidden
  # v2.20: постура безопасности — карта по 13 областям (status/evidence/severity)
  posture: governance/security-posture.yaml
  posture_validator: ai_ops_kit/validation/validate_security_posture.py
  policies: governance/security-policies.md
  information_boundaries: governance/information-boundaries.md
  audit_log: ".ai/runtime/interaction-log.jsonl"       # append-only действия ИИ (orchestrator)

session_orchestration:
  # v2.22: внешний слой автоматики вокруг ядра task->workflow->agents->gates.
  # Срез 1: онбординг репозитория + реестр активных работ + session bootstrap.
  # Кит даёт скиллы/команды/инструменты/схему; «само-срабатывание» (распознать «подключи
  # AI Ops», авто-старт bootstrap в новой сессии, worktree-per-WorkItem) — поведение
  # рантайма, объявляется как runtime-binding, не как возможность кита.
  status: partial
  verified_against_deploy: false            # ЧЕСТНО: авто-триггеры рантайма отсюда не проверялись
  repo_onboarding:
    skill: skills/repo-onboarding/SKILL.md
    checklist: rules/meta/repo-onboarding.yaml
    writes: context/**                       # черновики; источник истины подтверждает человек
  active_work_registry:
    schema: schemas/active-work.schema.json
    tool: tools/active_work.py               # register/list/check(conflict forecast)/finish
    child_path: ".ai/runtime/active-work.yaml"   # видна всем параллельным сессиям
    conflict_kinds: [area, contract, dependency, cycle]   # v2.23: явные связи задач + типы конфликта
  living_status:                              # v2.27: единая точка правды о «сейчас»
    doc: context/product/ProductStatus.md      # что реально готово/живёт; volatile + freshness
    policy: rules/core/ProductStatusPolicy.md  # читать первым; обновлять на PR, меняющем готовность
    read_first_in: commands/task/ai-session-start.md
    updated_in: commands/task/ai-finish-task.md
    anti_pattern: "CLAUDE.md держит только вечные правила; снимок статуса — ссылкой на ProductStatus"
    required_context_docs:                     # v3.12.0 Startup Context Budget: обязательные документы
      # контекста репозитория (ярус 1). update back-fill'ит отсутствующие из шаблонов (status: draft),
      # doctor сообщает пробел, validate_context_completeness проверяет полноту project/custom-оверлея.
      # Пути относительно context/ (в репо: .ai/project/context/<путь>).
      - product/ProductStatus.md               # что реально готово/живёт (ярус 1)
      - now.md                                 # снимок на дату (ярус 1)
  product_operating_model:                    # v3.35: модель продуктового репозитория
    registry: registry/product-operating-model.yaml   # 8 контуров, роли, типы работы, состояния
    package: ai_ops_kit/planning                      # контур Planning & Execution в коде
    validator: ai_ops_kit/validation/validate_product_model.py
    gate: contour_consistency                         # advisory до обкатки на child-репозиториях
    commands: [next, model, bootstrap]                # четыре вопроса / понимание / первый план
    # v3.35.2 (тир 4): BOOTSTRAP БЫЛ СТРОКОЙ. Первый сценарий объявлял
    # `… ASK -> BOOTSTRAP -> PLAN -> RECOMMEND`, но кит не создавал ни направления, ни плана:
    # владелец после онбординга оставался с пониманием и без работы. Теперь создаёт — из фактов
    # аудита, не перезаписывая существующее, и с пометками «нужно ваше слово» там, где факта нет.
    bootstrap:
      module: ai_ops_kit/planning/product_bootstrap.py
      writes: [ROADMAP.md, planning/plan.yaml]        # по объявленным `paths`, если объявлены
      never_writes: "существующие файлы (кроме собственной заготовки `template: true`)"
      dry_run_by_default: true                        # запись в чужой репозиторий видна ДО записи
      invariant: >
        продуктовые факты не выдумываются: цели, боли и «следующий результат» из кода не выводятся,
        и на их месте стоит пометка владельцу, а не правдоподобный текст
    required_repo_artifacts:                          # обязательные артефакты контура планирования
      - ROADMAP.md                                    # направление: четыре горизонта
      - planning/plan.yaml                            # delivery plan: kind: delivery-plan
    templates:
      roadmap: templates/planning/ROADMAP.md
      plan: templates/planning/plan.yaml
    # v3.35.2 (тир 3): РЕПОЗИТОРИЙ ВПРАВЕ ОПИСАТЬ СЕБЯ. Пути артефактов были жёсткими, и монорепо,
    # где продукт живёт в `apps/web/`, не мог описать себя вовсе. Дополнить сигналы кита было можно,
    # снять — нельзя (`**/entities/**` в Feature-Sliced Design: 6 ложных находок из 9).
    child_declarations:                               # `.ai-ops.yaml -> product_operating_model`
      paths:
        plan: "где лежит delivery plan (по умолчанию planning/plan.yaml)"
        roadmap: "где лежит направление (по умолчанию ROADMAP.md)"
        note: "относительный путь внутри репозитория; абсолютный и `..` — ОШИБКА, не дефолт"
      contours:
        source_of_truth: "чем описывается контур в ЭТОМ продукте (сильнее догадки кита)"
        change_signals: "что считать изменением контура — ДОПОЛНЯЕТ сигналы кита"
        change_signals_remove: "снять конкретный сигнал кита (точное совпадение паттерна)"
        change_signals_replace: "объявить свой список единственным — догадки кита выключены"
    invariants:
      - "unknown != not_changed: контур без сигнальных путей кит видеть не умеет и говорит об этом"
      - "выводимый статус (ready/blocked/waiting) не объявляется — он считается из графа и гейтов"
      - "план называет РОЛЬ; исполнителя выбирает роутер в момент запуска"
      - "not_changed не требует обновления документов — бюрократии «8 документов на задачу» нет"
  communication:                              # v3.35: Human Communication Layer
    policy: registry/communication-policy.yaml
    presenter: ai_ops_kit/ui/presenter.py             # контракт UserMessage в КОДЕ, не только в скилле
    skill: skills/plain-language-communication/SKILL.md
    runtime_adapter: templates/runtime/claude-communication.md
    default_audience: product                         # по умолчанию — владелец продукта, не отладчик
    invariant: "перевод меняет язык, а не факты: degraded остаётся degraded на всех уровнях"
  concurrency_preflight:                      # v2.28: коллизии параллельной работы до старта
    gate: concurrency_preflight                # quality/gates.yaml, stage intake, advisory
    tool: tools/concurrency_preflight.py       # base_changes (git) + open PRs (gh -> REST) + active-work
    rule: rules/engineering/ConcurrencyAwareness.md
    open_prs_sources: [gh-cli, github-rest]     # v2.43: REST-фоллбэк (urllib), токен GITHUB_TOKEN/GH_TOKEN из env
    note: >
      git-часть (свежие мержи в base под целевыми путями = устаревшая премисса) детерминирована;
      открытые PR: gh CLI (если авторизован) -> GitHub REST API (токен только из env, не в логах) ->
      unavailable (нет ни gh, ни токена; не выдаётся за clean). GHE — через GITHUB_API_URL.
  session_bootstrap:
    command: commands/task/ai-session-start.md   # runtime-исполняемая: читает, не меняет
  worktree_per_workitem:                      # v2.24: изоляция файлов на WorkItem
    tool: tools/worktree.py                    # add/list/remove — реальная git-операция
    command: commands/task/ai-worktree.md
    child_dir: ".ai/worktrees/<id>"            # держать в .gitignore
    note: >
      Инструмент создаёт worktree реально (тест на temp-репо); «сессия автоматически берёт
      свой worktree» — шаг рантайма через ai-start-task, не гарантия кита.
  merge_to_memory:                            # v2.25: обновление памяти при мердже WorkItem
    tool: tools/merge_memory.py                # record -> memory/lessons-learned/<дата>-<id>.md
    flow: commands/task/ai-finish-task.md      # шаг «обновить repository memory»
    note: >
      Инструмент записи и flow — в ките; «авто» на реальном событии мерджа (хук CI/рантайма)
      — шаг рантайма, не гарантия кита.
  conversational_install:                     # v2.26: «подключи AI Ops» -> установка+онбординг
    generated_command: ai-ops-init             # tools/generate_runtime.py -> .claude/commands/
    installer: installer/ai_ops.py             # реальную установку делает CLI (silent update запрещён)
    onboarding_skill: skills/repo-onboarding/SKILL.md
    note: >
      Кит генерирует команду ai-ops-init (установка -> doctor -> repo-onboarding -> предложить
      presets -> отчёт). Распознавание естественной фразы «подключи AI Ops» и запуск — шаг
      рантайма; verified_against_deploy: false.
  memory_split:
    shared: [context/**, decisions/registry.yaml, registry/entities.yaml]   # общая продуктовая память
    isolated: [".ai/runtime/**", ".ai/generated/**", ".ai/worktrees/**"]    # состояние прогона/сессии
  # not_yet закрыт: все четыре среза Session & Repository Orchestration поставлены
  # (onboarding, active-work+связи, worktree, merge->memory, conversational install).
  # Остаётся runtime-часть: авто-срабатывание триггеров — привязка на уровне рантайма.

runtime_spec:
  # v2.21: спецификация постоянного агента-ассистента (Robin), runtime-агностичная.
  # Кит даёт контракт+спеку+валидатор; привязка к конкретному рантайму — на уровне child.
  status: contract                          # спека+валидатор есть; деплой рантайма — child
  verified_against_deploy: false            # ЧЕСТНО: из среды разработки не проверялось
  contract: persistent-agent-runtime        # registry/runtimes.yaml -> runtime_contracts
  spec: runtime/robin/ROBIN.md
  duties_example: runtime/robin/duties.example.yaml
  duties_validator: ai_ops_kit/validation/validate_duties.py
  binding_template: templates/runtime/runtime-binding.example.yaml
  child_duties_path: ".ai/project/runtime/robin/duties.yaml"
  read_mostly: true                          # нет записи в prod и в curated-память
  killswitch_runbook: governance/security-policies.md   # §3
  example_bindings: [Hermes, "cron+cli+webhook"]   # только примеры; не хардкод в ядре

update_policy:
  silent_update: forbidden
  updater: installer/ai_ops.py            # ai-ops status/diff/update/init/validate/doctor/migrate/verify-capabilities
  managed_set:                             # что копируется в .ai/managed при install/update
    - "registry/*.yaml"
    - "quality/gates.yaml"
    - "schemas/*.json"
    - "security/permission-levels.yaml"
    - "security/boundary-model.md"
    - "security/security-domains.yaml"   # v3.0-rc2: approvals/security_pack грузят универсально (любой diff)
    - "manifest/ai-ops-manifest.yaml"
    # полные контракты, на которые ссылаются реестры: тела агентов, правила/чек-листы,
    # шаблоны артефактов, контекст, прозаические workflow/команды — иначе registry
    # ссылается на файлы (agents/core/*.md, rules/**, templates/**), которых в child нет.
    - "agents/**/*.md"
    - "rules/**/*"
    - "templates/**/*"
    - "context/**/*"
    - "workflows/*.md"
    - "commands/**/*.md"
    # v2.82 Standalone Child: сам ДВИЖОК (инструменты + валидаторы + их данные) ставится в
    # child, чтобы `ai-ops run` и проверки работали БЕЗ внешнего клона кита. PKG движка =
    # .ai/managed/ (Path(__file__).parents[1]); registry/quality/security уже здесь, добавляем
    # код и остаток данных (config/*, VERSION). Пакетный фильтр применяется как обычно:
    # файлы, принадлежащие ai-ops-execution/quality/..., ставятся при выборе этих пакетов;
    # без выбора packages (дефолт) — ставится всё. Полный self-contained доказан
    # validate_standalone_engine.py (subprocess из .ai/managed без parent на path).
    # v3.30: код движка переехал в пакеты ai_ops_kit/*; tools/**/*.py остались тонкими
    # алиасами обратной совместимости, поэтому в поставку нужны ОБА — иначе алиас в
    # child-репозитории ссылается на несуществующий пакет.
    - "ai_ops_kit/**/*.py"
    - "tools/**/*.py"
    - "config/**/*"
    - "qualification/**/*"
    - "containers/*"
    - "VERSION"
  managed_paths: [".ai/managed/**"]
  protected_paths: [".ai/project/**", ".ai/custom/**"]
  generated_paths: [".ai/generated/**"]
  runtime_paths: [".ai/runtime/**"]
  provenance: ".ai/managed/.provenance.json"
  checksums: ".ai/managed/.checksums.json"
  update_lock: ".ai/managed/.update-lock"
  drift_detection: "ai_ops_kit/validation/ai_managed_checksums.py verify"
  example_install: "examples/child-install/"

package_migrations:
  # v3.34: валидаторы переехали в ai_ops_kit/validation/ — раскладка child зеркалит кит.
  chain:
    - 3.33-to-3.34
    # F-030: правило «закрытая работа живёт в history» пришло к дочкам БЕЗ миграции, и обновление
    # ломало им ответ «что дальше» (замер на ИИ-Среде 17.08.2026: `next` отказывался отвечать и
    # печатал 32 ошибки). Перенос — по решению владельца, с пометкой «результат не записан».
    - 3.36-to-3.37-plan-history

contracts_dir: schemas/
compatibility_check: python3 ai_ops_kit/validation/validate_ai_first_registry.py
