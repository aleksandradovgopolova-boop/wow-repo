# rules/core/field-lessons.yaml — правила, оплаченные полем, а не выведенные из вкуса.
#
# ПОЧЕМУ ФАЙЛ ПОЯВИЛСЯ. Шесть правил ниже этот репозиторий выучил дорого: каждое стоило дней
# работы, каждое уже записано в коде, гейтах и отчётах — но НИ ОДНО не лежало там, где культуру
# получают дочки. Они жили в памяти человека, который вёл сессии, и в комментариях к тем самым
# местам, где дефект случился. Знание в комментарии рядом с дефектом видит тот, кто и так туда
# смотрит; правило в `rules/**` едет к каждому подключённому репозиторию через `managed_set`.
#
# КАЖДОЕ ПРАВИЛО ПОДКРЕПЛЕНО (`grounding`) местом В ЭТОМ РЕПОЗИТОРИИ, где оно было оплачено.
# Это не оформление: в ките нельзя объявлять правило без основания — тот же инвариант, что
# «capability-декларации честные». Ссылки МАШИННО ПРОВЕРЯЮТСЯ (`validate_own_medicine.py`):
# исчез файл или цитата — правило краснеет, а не тихо превращается в лозунг.
#
# ЧЕСТНО О ФОРМУЛИРОВКАХ. Правила названы так, как их подтверждает репозиторий, а не так, как
# они звучали в разговоре. Где ходовая формулировка шире найденного основания, взята узкая:
#  * `local-green-is-not-ci-green` — основание про ОХВАТ (PR #38, `evidence_scopes`), а не про
#    конкретную команду `gh pr checks`: такой строки в репозитории нет;
#  * `verify-in-the-tree-you-edited` — основание про editable-установку, пояс `PYTHONPATH` и
#    глобальный `REPO_ROOT`; про составной `cd` в репозитории основания нет;
#  * `name-the-scope-you-checked` — основание про названный охват и `does_not_cover`; формулировки
#    «top-N» в репозитории нет.
schema_version: 1
kind: quality-checklist
id: field-lessons
used_by: [final-verifier, code-reviewer, plan-reviewer]
applies_to: every-repository        # не opt-in: это не про UI и не про стек, а про способ проверять

lessons:
  - id: green-test-proves-nothing-without-mutation
    rule: >
      «Тест зелёный» — не доказательство. Доказательство — что тест КРАСНЕЕТ на дефекте: верни код
      до правки (или внеси мутацию) и убедись, что тест падает. Тест, который проходит и без
      исправления, не проверяет исправление.
    why: >
      Тест писался по тому же представлению, что и правка, и потому подтверждает представление,
      а не поведение. Замер: мутационное ревью дало 61% убитых мутантов при заявленной дисциплине
      «три теста на capability» — 17 из 44 мутантов выживали, и первым же выжившим оказалась
      регрессия, внесённая несколькими часами ранее.
    check: >
      Для каждой правки поведения: назвать команду, которой тест был прогнан на коде ДО правки,
      и её результат (падение). Гейт `regression_test_evidence` требует этого машинно.
    grounding:
      - {file: quality/gates.yaml, contains: "падает на коде ДО правки и проходит"}
      - {file: ai_ops_kit/gates/regression_evidence.py, contains: "тест, который проходит и без исправления, ничего не доказывает"}
      - {file: CHANGELOG.md, contains: "44 мутанта, 17 выживших"}
      - {file: pytest.ini, contains: "Мутационное ревью показало цену"}

  - id: local-green-is-not-ci-green
    rule: >
      Прежде чем сказать «контур зелёный», НАЗОВИ ОХВАТ и посмотри на результат того охвата, о
      котором говоришь. Локальный прогон — это `full-current-python`: один интерпретатор, одна ОС,
      уже установленное окружение. Матрицу совместимости, чистую установку и e2e даёт только CI, и
      их вердикт нужно прочитать, а не предположить.
    why: >
      Слово «полный» без величины охвата — не преувеличение, а ДРУГОЕ утверждение. Замер: PR #38
      написал «полный контур зелёный», и джоба `python39-compat` опровергла это в том же релизе.
    check: >
      Заявление о полноте обязано называть охват из `registry/release-claims.yaml -> evidence_scopes`
      вместе с его `does_not_cover`; безымянное «полный» отклоняет `validate_release_claims`.
    grounding:
      - {file: AGENTS.md, contains: "Повод: PR #38 написал «полный контур зелёный»"}
      - {file: registry/release-claims.yaml, contains: "does_not_cover"}
      - {file: tests/unit/test_evidence_scope.py, contains: "PR #38"}

  - id: verify-in-the-tree-you-edited
    rule: >
      Проверяй в том дереве, где правил, и убедись в этом ЯВНО — печатью пути, из которого
      подгрузился модуль. Editable-установка, пояс `PYTHONPATH` и глобальный корень вместо
      переданного молча уводят прогон в другое дерево, и тогда «зелёный» относится не к твоему коду.
    why: >
      Замер, дважды: импорт валидаторов резолвился только там, где `tools/` уже был в путях — в CI
      из-за `PYTHONPATH`, у разработчика из-за editable-установки, то есть в дочке кит не работал, а
      контур молчал. И `sync_ci_workflows(other_root)` писал отпечатки в ТЕКУЩИЙ репозиторий вместо
      обслуживаемого — поймано тем, что в коммит кита попал чужой файл.
    check: >
      До слов о результате прогона: путь запуска и путь загруженного модуля названы и совпадают с
      деревом правки. Проверка, которая сама себе стелет `PYTHONPATH`, проверяет не то, что обещает.
    grounding:
      - {file: installer/ai_ops.py, contains: "а не от глобального"}
      - {file: CHANGELOG.md, contains: "«работает локально» из-за editable-установки"}
      - {file: tests/unit/test_validator_runtime_contract.py, contains: "сама себе стелет путь"}

  - id: unavailable-is-not-zero
    rule: >
      Отсутствие данных — отдельное состояние, и сворачивать его в удобное соседнее запрещено.
      `unavailable` НИКОГДА не равно 0; `unknown` НИКОГДА не равно `not_changed`; неоценённое
      НИКОГДА не равно здоровому.
    why: >
      Ноль означал бы «задача бесплатна» — на такой лжи граница пропустила бы что угодно. Замеры:
      контур архитектуры заявлял `not_changed` там, где честный ответ был `unknown`; presenter
      выбрасывал все `unknown_contour` и сообщал владельцу «всё согласовано», проверив один контур
      из восьми; `derive_status` при неоценённом здоровье blueprint отдавала `done`.
    check: >
      Каждое место, где значение может не получиться, различает три исхода, а не два, и третий
      доезжает до человека на всех уровнях детализации.
    grounding:
      - {file: ai_ops_kit/gates/economic_preflight.py, contains: "НИКОГДА 0"}
      - {file: ai_ops_kit/planning/contours.py, contains: "не сворачивается в"}
      - {file: ai_ops_kit/ui/presenter.py, contains: "проверил один контур из восьми"}
      - {file: AGENTS.md, contains: "третье НЕ равно второму"}

  - id: name-the-scope-you-checked
    rule: >
      Если охват урезан — выборкой, порядком, единственным файлом, одной версией, прогоном без
      повтора, — это НАЗЫВАЕТСЯ вместе с результатом. Молчаливое усечение читается как «покрыто
      всё»: у утверждения без границы граница подразумевается максимальная.
    why: >
      Замер: механизм проверки чисел в документации существовал и перечислял ОДИН файл, поэтому три
      документа говорили «32 гейта» при фактических 34 — и печатался зелёный `CLAIMS-OK`. Охват
      1 → 5 закрыл это. Обратный, правильный образец рядом: у каждого объявленного охвата есть
      `does_not_cover`, потому что охват без границы снова означает «полный».
    check: >
      Рядом с результатом названы: что вошло в проверку, что НЕ вошло, и размер выборки, если она
      есть. Пустое поле границы — ошибка, а не мелочь.
    grounding:
      - {file: registry/release-claims.yaml, contains: "пол проверен"}
      - {file: ai_ops_kit/validation/validate_release_claims.py, contains: "снова означает"}
      - {file: docs/audit-report.md, contains: "Что проверить не удалось"}

  - id: evidence-names-the-source-of-values
    rule: >
      Evidence называет место, ОТКУДА ВЗЯТЫ ЗНАЧЕНИЯ, а не место, на которое удобно сослаться. И
      никогда не ссылается на артефакт, который сам же и записал.
    why: >
      Замер (F-019): значения команд читались из манифестов стека (`package.json -> scripts`), а
      evidence указывал на workflow'ы, которые никогда не разбирались — ссылка ложна даже там, где
      CI настоящий. Половина того же дефекта: в репозитории БЕЗ собственного CI кит объявлял
      владельцу `status=verified`, ссылаясь на артефакты, которые записал секундой раньше.
    check: >
      Для каждого значения в evidence: путь, из которого оно прочитано, и пометка о том, что НЕ
      разбиралось. Самоподтверждение (свой артефакт как доказательство продуктового факта) — дефект.
    grounding:
      - {file: ai_ops_kit/planning/repo_audit.py, contains: "а не из шагов workflow"}
      - {file: qualification/REAL-PRODUCT-SEVERNAYA-2026-08-12.md, contains: "источник значений назван"}
      - {file: planning/plan.yaml, contains: "evidence называет источник значений"}
