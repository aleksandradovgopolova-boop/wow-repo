# rules/design/accessibility-checklist.yaml — машиночитаемый a11y-чек-лист (Ф2 roadmap, v1.5).
# Основа: WCAG 2.2 уровень AA (подмножество, проверяемое на артефактах и в ручном ревью).
# Используется accessibility-reviewer'ом; дополняет прозаический rules/quality/AccessibilityBaseline.md.
#
# constitution_id (волна 2, design-gates-cite-constitution-ids): стабильный ID правила
# UI/UX-Конституции (standards/uiux/), к которому пункт привязан ПО СМЫСЛУ. Находка ревью цитирует
# и WCAG-критерий, и этот ID Конституции. `none` — у пункта нет правила-двойника в Конституции
# (расхождения зафиксированы в standards/uiux/gate-reconciliation.md).
# Это НАБЛЮДЕНИЕ: сила гейта accessibility_review (blocking/severity_policy) не меняется.
schema_version: 1
kind: design-checklist
id: accessibility-checklist
used_by: [accessibility-reviewer]
wcag_level: AA
items:
  - {id: contrast-text, wcag: "1.4.3", check: "Контраст текста >= 4.5:1 (крупный >= 3:1)", severity_default: critical, constitution_id: UI-029}
  - {id: contrast-ui, wcag: "1.4.11", check: "Контраст нетекстовых элементов UI и состояний >= 3:1", severity_default: major, constitution_id: UI-029}
  - {id: keyboard, wcag: "2.1.1", check: "Вся функциональность доступна с клавиатуры, нет ловушек фокуса", severity_default: critical, constitution_id: UI-026}
  - {id: focus-visible, wcag: "2.4.7", check: "Фокус всегда видим; порядок фокуса следует смыслу", severity_default: critical, constitution_id: UI-029}
  - {id: labels, wcag: "1.3.1", check: "Поля и контролы имеют программно связанные подписи (label/aria)", severity_default: critical, constitution_id: UI-028}
  - {id: errors-described, wcag: "3.3.1", check: "Ошибки ввода описаны текстом и связаны с полем, не только цветом", severity_default: major, constitution_id: UI-020}
  - {id: color-not-only, wcag: "1.4.1", check: "Цвет — не единственный носитель информации", severity_default: major, constitution_id: UI-027}
  - {id: text-resize, wcag: "1.4.4", check: "Текст масштабируется до 200% без потери функциональности", severity_default: major, constitution_id: UI-030}
  - {id: target-size, wcag: "2.5.8", check: "Размер интерактивных целей >= 24x24 CSS px (мобильные — 44)", severity_default: major, constitution_id: UI-040}
  - {id: alt-media, wcag: "1.1.1", check: "Нетекстовый контент имеет текстовую альтернативу", severity_default: major, constitution_id: none}
  - {id: screen-reader-flow, wcag: "4.1.2", check: "Имя/роль/значение элементов доступны screen reader; динамические изменения анонсируются", severity_default: critical, constitution_id: UI-028}
  - {id: motion, wcag: "2.3.3", check: "Анимации отключаемы (prefers-reduced-motion); нет мигания >3 раз/с", severity_default: minor, constitution_id: UI-034}
