# rules/design/design-system-checklist.yaml — машиночитаемый чек-лист дизайн-системы (Ф2 roadmap, v1.5).
# Используется design-system-reviewer'ом. Гейт: design_system_usage.
#
# constitution_id (волна 2, design-gates-cite-constitution-ids): стабильный ID правила
# UI/UX-Конституции (standards/uiux/), к которому пункт привязан ПО СМЫСЛУ. Находка ревью цитирует
# этот ID. `none` — у пункта нет правила-двойника в Конституции (расхождения зафиксированы в
# standards/uiux/gate-reconciliation.md). Это НАБЛЮДЕНИЕ: сила гейта design_system_usage
# (blocking) не меняется.
schema_version: 1
kind: design-checklist
id: design-system-checklist
used_by: [design-system-reviewer]
gate: design_system_usage
items:
  - {id: components-reuse, check: "Компоненты берутся из дизайн-системы проекта; нет самодельных дублей штатных компонентов", severity_default: critical, constitution_id: UI-012}
  - {id: tokens-only, check: "Цвета, типографика, отступы, радиусы — только через токены; нет ad-hoc значений", severity_default: major, constitution_id: UI-014}
  - {id: variants-standard, check: "Используются штатные вариации/размеры/состояния компонентов, а не переопределённые", severity_default: major, constitution_id: UI-015}
  - {id: new-component-justified, check: "Новый компонент: зафиксировано, почему существующие не подошли; согласовано добавление в систему", severity_default: critical, constitution_id: UI-012}
  - {id: icons-standard, check: "Иконки — из библиотеки системы, единый стиль и размерная сетка", severity_default: minor, constitution_id: none}
  - {id: no-system-fallback, check: "Если дизайн-системы в проекте нет — это зафиксировано явно, проверяется внутренняя консистентность экранов", severity_default: major, constitution_id: UI-041}
