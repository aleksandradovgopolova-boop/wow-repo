# ai-ops-storybook-preview.yml — превью Storybook в PR как CI-АРТЕФАКТ статической сборки.
# Устанавливается `ai-ops init`/`update` в .github/workflows/ ТОЛЬКО UI-продуктам (есть Storybook-
# конфиг/зависимость/скрипт) — контур доставки гейтит его по корню дочки, чтобы бэкенд-репо не
# получал workflow, которому нечего собирать. Опт-аут: удалить этот файл.
#
# ЧТО ДЕЛАЕТ. На pull_request, ЗАТРАГИВАЮЩИХ UI (пути ниже), собирает Storybook СОБСТВЕННЫМ
# build-скриптом дочки (её собственный npm-скрипт сборки Storybook), выкладывает статическую сборку как CI-артефакт
# `storybook-static` и оставляет в PR комментарий «превью собрано, скачайте артефакт». Так превью
# доступно ревьюеру без внешнего хостинга.
#
# ГРАНИЦЫ, КОТОРЫЕ КИТ ДЕРЖИТ ОСОЗНАННО (см. ai_ops_kit/ui/ui_readiness.py — «установку зависимостей
# делает ВЛАДЕЛЕЦ»):
#   * Кит НЕ ставит зависимости и НЕ запускает `storybook init` в рабочем дереве владельца. Здесь
#     раннер CI ЭФЕМЕРНЫЙ: `npm ci` ставит ровно то, что владелец УЖЕ объявил в своём lock-файле,
#     чтобы вызвать ЕГО собственный скрипт сборки. package.json/node_modules репозитория не меняются.
#   * Превью = upload статической сборки артефактом CI. НИКАКИХ внешних сервисов и секретов
#     (ни Chromatic, ни Netlify) — только `actions/upload-artifact`.
#   * Нет build-скрипта Storybook -> собирать нечего -> job ЧЕСТНО скипается (не падает): владелец
#     сначала настраивает Storybook (шаблон скрипта даёт `ai-ops ui-status`), потом превью заработает.
#
# Экшены закреплены версионным тегом (@v4/@v7) — тот же способ пина, что во всех workflow кита
# (ai-ops-record.yml/ai-ops-validate.yml/ai-ops-scorecard.yml). Инструменты кита здесь НЕ нужны:
# workflow самодостаточен (клона parent-кита нет), поэтому и на self-hosted раннере не зависит от него.
name: ai-ops-storybook-preview
on:
  pull_request:
    paths:
      - '**/*.stories.*'
      - '**/*.story.*'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.vue'
      - '**/*.svelte'
      - '**/*.css'
      - '**/*.scss'
      - '**/*.less'
      - '**/.storybook/**'
      - '**/components/**'
      - '**/stories/**'
      - '**/ui/**'
  workflow_dispatch: {}
# Наименьшие права: чтение содержимого + запись комментария в PR. Секретов нет — превью локальное (артефакт).
permissions:
  contents: read
  pull-requests: write
concurrency:
  # Отменять УСТАРЕВШИЕ прогоны — но ТОЛЬКО для PR (новый пуш в тот же PR гасит прежний).
  # На push в main / schedule / release / record отмена НЕ применяется: там каждый прогон
  # относится к своему коммиту/событию, и его потеря = дыра в проверке или в записи.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  storybook-preview:
    # Раннер выбирается ПЕРЕМЕННОЙ, а не зашит (как в остальных workflow кита): `ubuntu-latest`
    # существует только у GitHub; в организации со своими раннерами задайте `vars.CI_RUNNER_LINUX`.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # ЧЕСТНЫЙ ГЕЙТ + РЕАЛЬНОЕ ИМЯ СКРИПТА + УЖЕ СОБРАННЫЙ Storybook. Приоритет:
      #   1) есть build-скрипт -> собрать СВЕЖЕЕ (отражает изменения этого PR);
      #   2) build-скрипта нет, но в репозитории уже лежит готовая статическая сборка
      #      (`storybook-static/`) -> выложить её как есть (проект собирает Storybook вне этого CI);
      #   3) ни того, ни другого -> честный skip (это НЕ ошибка).
      # Имя скрипта произвольное (`build-storybook` / `build:storybook` / `storybook:build` …), поэтому
      # запускать сборку ЗАШИТЫМ именем нельзя — обнаружение пройдёт, а запуск упадёт на несуществующем
      # имени (полевая находка ии-среда, 2026-09-16). Резолвим РЕАЛЬНОЕ имя; python3 есть до setup-node.
      - name: Есть ли у дочки Storybook (скрипт сборки или готовая статика)?
        id: detect
        run: |
          DETECT=$(python3 - <<'PY'
          import json, os, sys
          scripts = {}
          try:
              scripts = (json.load(open("package.json")).get("scripts") or {})
          except (OSError, ValueError):
              scripts = {}
          # 1) канонический скрипт по имени; 2) любой скрипт, чья КОМАНДА собирает Storybook.
          name = "build-storybook" if "build-storybook" in scripts else next(
              (k for k, v in scripts.items()
               if isinstance(v, str) and ("storybook build" in v or "build-storybook" in v)), "")
          # Уже собранная статика (несколько известных имён каталога вывода Storybook).
          prebuilt_dir = next((d for d in ("storybook-static", ".storybook-static", "storybook_static")
                               if os.path.isdir(d) and os.listdir(d)), "")
          if name:
              print(f"has=true\nscript={name}\nprebuilt=")
          elif prebuilt_dir:
              print(f"has=true\nscript=\nprebuilt={prebuilt_dir}")
          else:
              print("has=false")
          PY
          )
          echo "$DETECT" >> "$GITHUB_OUTPUT"
          if echo "$DETECT" | grep -q '^script=.\+'; then
            echo "Storybook build-скрипт найден ($(echo "$DETECT" | sed -n 's/^script=//p')) — собираю свежее превью."
          elif echo "$DETECT" | grep -q '^prebuilt=.\+'; then
            echo "Готовая статика Storybook найдена ($(echo "$DETECT" | sed -n 's/^prebuilt=//p')) — выкладываю как есть (без пересборки)."
          else
            echo "Storybook не найден (ни build-скрипта, ни готовой статики) — превью пропущено (это НЕ ошибка):"
            echo "сначала настройте Storybook у себя (шаблон скрипта: ai-ops ui-status), потом превью заработает."
          fi
      - uses: actions/setup-node@v4
        # node нужен только для СБОРКИ; для уже готовой статики его не ставим.
        if: steps.detect.outputs.script != ''
        with:
          node-version: '20'
      - name: Кэш npm (ускоряет установку зависимостей)
        # Кэшируем только когда есть lock-файл (иначе ключ нестабилен, а setup-node cache вовсе падает
        # без lock). Гейт на script != '' — кэш нужен лишь на пути СБОРКИ, не для готовой статики.
        if: steps.detect.outputs.script != '' && hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json') != ''
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - name: Собрать Storybook СКРИПТОМ ДОЧКИ
        if: steps.detect.outputs.script != ''
        run: |
          # Эфемерный раннер CI: ставим объявленные владельцем зависимости (его lock-файл) и зовём
          # ЕГО скрипт. Кит не добавляет и не меняет зависимости — только собирает уже настроенное.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi
          # РЕАЛЬНОЕ имя скрипта дочки (из detect), а не зашитое имя.
          npm run "${{ steps.detect.outputs.script }}"
      - name: Взять уже готовую статику Storybook
        # Проект собирает Storybook вне этого CI — берём его каталог вывода как есть.
        if: steps.detect.outputs.script == '' && steps.detect.outputs.prebuilt != ''
        run: |
          if [ "${{ steps.detect.outputs.prebuilt }}" != "storybook-static" ]; then
            cp -R "${{ steps.detect.outputs.prebuilt }}" storybook-static
          fi
          echo "Использую готовую статику из «${{ steps.detect.outputs.prebuilt }}» без пересборки."
      - name: Выложить сборку как артефакт превью
        if: steps.detect.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          if-no-files-found: error
      - name: Комментарий в PR — превью собрано
        if: steps.detect.outputs.has == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- ai-ops-storybook-preview -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const body = [
              marker,
              '**Превью Storybook собрано.** Скачайте статическую сборку как артефакт ' +
                '`storybook-static` этого прогона и откройте `index.html` локально.',
              '',
              `Артефакт — во вкладке Artifacts прогона: ${runUrl}`,
              '',
              '_Превью — CI-артефакт, без внешнего хостинга и секретов. Зависимости кит не ставит: ' +
                'сборка идёт вашим build-скриптом Storybook на эфемерном раннере._',
            ].join('\n');
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number});
            const prior = comments.data.find(c => (c.body || '').includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({owner, repo, comment_id: prior.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
