# ai-ops-update.yml — автообновление AI Ops Kit в child-репозитории.
# Устанавливается командой `ai-ops init` в .github/workflows/ (или скопируйте вручную).
# Раз в день сверяет installed_version из .ai-ops.yaml с VERSION родительского пакета;
# при расхождении запускает `ai-ops update` и открывает PR с diff'ом и отчётом.
# Обновление НЕ применяется в обход PR; drift managed-слоя блокирует обновление штатно.
#
# Флаг parent.auto_update в .ai-ops.yaml уважается. ПО УМОЛЧАНИЮ ВКЛ (v3.0.5): ежедневный запуск сам
# открывает update-PR, если ключ отсутствует ИЛИ auto_update: true. Чтобы ОТКЛЮЧИТЬ ежедневные PR —
# поставьте auto_update: false (опт-аут). Ручной запуск (workflow_dispatch) работает всегда.
#
# Флаг parent.auto_merge_patch — авто-слияние ТОЛЬКО патч-версий (совпадают major.minor, растёт
# patch). ПО УМОЛЧАНИЮ ВЫКЛ: слияние в main сильнее, чем открыть PR, поэтому это опт-ин рукой
# владельца. Минор и мажор всегда остаются на ревью. Мерж не мгновенный — через `gh pr merge --auto`,
# то есть после обязательных проверок ветки (branch protection). Без настроенной защиты ветки GitHub
# сольёт сразу — тогда включайте флаг осознанно (и учтите примечание про GITHUB_TOKEN ниже).
#
# CI на update-PR. PR, созданный GITHUB_TOKEN, GitHub не запускает через `on: pull_request`
# (защита от рекурсии). Чтобы проверки шли на update-PR (и авто-мерж патчей реально их ждал):
# заведите secret AI_OPS_PAT — fine-grained PAT или токен GitHub App с правами contents:write и
# pull-requests:write. Тогда PR авторства этого токена, и CI дочки на нём стартует штатно. Без
# секрета всё работает как раньше (PR открывается, но проверки на нём сами не запускаются).
name: ai-ops-update
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
# Lane A3: минимальные привилегии для автообновления.
# contents: write — нужен для git push ветки обновления.
# pull-requests: write — нужен для gh pr create.
permissions:
  contents: write
  pull-requests: write
concurrency:
  # Отменять УСТАРЕВШИЕ прогоны — но ТОЛЬКО для PR (новый пуш в тот же PR гасит прежний).
  # На push в main / schedule / release / record отмена НЕ применяется: там каждый прогон
  # относится к своему коммиту/событию, и его потеря = дыра в проверке или в записи.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    # Раннер выбирается ПЕРЕМЕННОЙ, а не зашит. `ubuntu-latest` существует только у
    # GitHub: в организации со своими раннерами джоба с этим ярлыком просто висит в
    # очереди и никогда не стартует. Задайте `vars.CI_RUNNER_LINUX` (Settings ->
    # Secrets and variables -> Actions -> Variables) — и кит поедет на вашей машине.
    # Обкатано на живом self-hosted стенде ии-среды, а не придумано.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        # Токен для пуша ветки и создания PR. Если задан secret AI_OPS_PAT (fine-grained PAT или
        # токен GitHub App с правами contents+pull-requests) — берём его: тогда update-PR авторства
        # этого токена, и обычный CI дочки (`on: pull_request`) на нём ЗАПУСКАЕТСЯ. Без секрета —
        # github.token (как раньше): PR создаётся, но GitHub не стартует на нём проверки сам, и
        # авто-мерж патчей `--auto` ждать нечего. Хотите CI на update-PR (и осмысленный авто-мерж) —
        # заведите secret AI_OPS_PAT.
        with:
          token: ${{ secrets.AI_OPS_PAT || github.token }}
      # Python ставим ТОЛЬКО на раннерах GitHub. На своей машине `setup-python` уходит в
      # tool cache по пути раннеров GitHub (`/Users/runner`), которого там нет, а `pip install`
      # в системный python Ubuntu 24.04 запрещён (PEP 668, externally-managed-environment).
      - uses: actions/setup-python@v5
        if: ${{ !vars.CI_RUNNER_LINUX }}
        with: {python-version: "3.12"}
      - run: pip install pyyaml
        if: ${{ !vars.CI_RUNNER_LINUX }}
      # На своём раннере предустановку не молчим, а ПРОВЕРЯЕМ: иначе первое падение случится
      # глубже и невнятнее — так у ии-среды `net::ERR_CONNECTION_REFUSED` прятал отсутствие
      # утилиты. Здесь причина названа сразу.
      - name: Проверить python и pyyaml (свой раннер)
        if: ${{ vars.CI_RUNNER_LINUX }}
        run: |
          python3 -c 'import sys, yaml; print("python", sys.version.split()[0], "· pyyaml", yaml.__version__)' \
            || { echo "на раннере '${{ vars.CI_RUNNER_LINUX }}' нет python3 с pyyaml — поставьте их на машину раннера (кит ставить их в системный python не будет: PEP 668)"; exit 1; }
      - name: Сравнить версии parent-пакета
        id: ver
        run: |
          PARENT=$(python3 -c "import yaml; s=yaml.safe_load(open('.ai-ops.yaml'))['parent']['source']; print(s[4:] if s.startswith('git+') else s)")
          INSTALLED=$(python3 -c "import yaml; print(yaml.safe_load(open('.ai-ops.yaml'))['parent']['installed_version'])")
          AUTO=$(python3 -c "import yaml; print(str(yaml.safe_load(open('.ai-ops.yaml'))['parent'].get('auto_update', True)).lower())")
          CHANNEL=$(python3 -c "import yaml; print(yaml.safe_load(open('.ai-ops.yaml'))['parent'].get('update_channel','stable'))")
          # КЛОН С ТЕГАМИ, А НЕ HEAD ВЕТКИ (аудит 19.08.2026). Здесь стояло `git clone --depth 1`,
          # то есть бралась ветка по умолчанию — канал `edge`, — тогда как дочка объявляет свой
          # канал в `.ai-ops.yaml` и до этой правки это объявление не читала НИ ОДНА строка кода.
          # `--filter=blob:none` держит клон лёгким и при этом даёт теги: выбирать выпуск, не видя
          # выпусков, нельзя.
          git clone --filter=blob:none "$PARENT" "$RUNNER_TEMP/ai-ops-kit"
          # Какую ревизию брать под объявленный канал — решает кит, а не эта строка bash.
          # Код 2 = «под этот канал брать нечего»; тогда обновление НЕ выполняется, и причина
          # печатается. Тихо взять ветку значило бы вернуть исходный дефект: просят `stable`,
          # получают `edge`.
          if REF=$(python3 "$RUNNER_TEMP/ai-ops-kit/installer/ai_ops.py" resolve-ref \
                     --channel "$CHANNEL" --repo "$RUNNER_TEMP/ai-ops-kit"); then
            [ -n "$REF" ] && git -C "$RUNNER_TEMP/ai-ops-kit" checkout -q "$REF"
            echo "канал '$CHANNEL' -> ${REF:-ветка по умолчанию}"
          else
            echo "::notice::обновление пропущено: под канал '$CHANNEL' брать нечего (см. причину выше)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AVAILABLE=$(tr -d '[:space:]' < "$RUNNER_TEMP/ai-ops-kit/VERSION")
          echo "installed=$INSTALLED available=$AVAILABLE auto_update=$AUTO event=${{ github.event_name }}"
          echo "installed=$INSTALLED" >> "$GITHUB_OUTPUT"
          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          echo "auto_update=$AUTO" >> "$GITHUB_OUTPUT"
          echo "needs_update=$([ "$INSTALLED" != "$AVAILABLE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # разрешаем открывать PR только при auto_update: true ИЛИ ручном запуске
          echo "proceed=$([ \"$INSTALLED\" != \"$AVAILABLE\" ] && { [ \"$AUTO\" = true ] || [ \"${{ github.event_name }}\" = workflow_dispatch ]; } && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Пропуск (auto_update:false, запуск по расписанию)
        if: steps.ver.outputs.needs_update == 'true' && steps.ver.outputs.proceed != 'true'
        run: echo "Доступно обновление $INSTALLED -> $AVAILABLE, но parent.auto_update=false (опт-аут) и запуск по расписанию — PR не открывается. Запустите workflow вручную (Run workflow) или включите auto_update."
      # `--in-place` ОБЯЗАТЕЛЕН здесь и появился вместе с F-022. Без него `update` при
      # `parent.update_policy: pr` уходит в отдельную ветку сам — и этот workflow, который делает
      # ветку и PR СЛЕДУЮЩИМ шагом, получил бы ветку в ветке и пустой diff. Флаг говорит: применяй
      # на месте, PR открою я. Политика при этом соблюдена — просто другим механизмом, и здесь это
      # видно, а не подразумевается.
      - name: Запустить ai-ops update
        if: steps.ver.outputs.proceed == 'true'
        run: python3 "$RUNNER_TEMP"/ai-ops-kit/installer/ai_ops.py update --in-place
      - name: Открыть PR с обновлением
        if: steps.ver.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_OPS_PAT || github.token }}
          HAS_PAT: ${{ secrets.AI_OPS_PAT != '' }}
          TO: ${{ steps.ver.outputs.available }}
          FROM: ${{ steps.ver.outputs.installed }}
        run: |
          if [ "$HAS_PAT" = true ]; then
            echo "токен: AI_OPS_PAT — CI дочки запустится на update-PR"
          else
            echo "::notice::secret AI_OPS_PAT не задан — PR откроется, но CI на нём GitHub сам не запустит (и авто-мержу патчей нечего ждать). Заведите AI_OPS_PAT, чтобы проверки шли на update-PR."
          fi
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "изменений нет — PR не нужен"; exit 0
          fi
          BRANCH="ai-ops/update-v$TO"
          git config user.name "ai-ops-updater"
          git config user.email "ai-ops-updater@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore: ai-ops update $FROM -> $TO"
          # Lane A3: --force-with-lease безопаснее -f — не перетирает чужие коммиты на ветке,
          # если кто-то успел запушить туда свою работу между нашим fetch и push.
          git push --force-with-lease -u origin "$BRANCH"
          gh pr list --head "$BRANCH" --json number --jq length | grep -q '^0$' || exit 0
          REPORT=".ai/runtime/last-update-report.json"
          [ -f "$REPORT" ] || REPORT=""
          {
            echo "Автообновление AI Ops Kit: **$FROM → $TO**."
            echo
            echo "Локальные слои (\`.ai/project/\`, \`.ai/custom/\`) не тронуты."
            echo
            # ЧТО МЕНЯЕТСЯ ДЛЯ ВАС (#1210) — слой владельца каждой версии между FROM и TO, ТЕКСТОМ, а не
            # внутри JSON ниже. Тот же приём, что у раздела безопасности: python читает ФАЙЛ отчёта
            # сам, текст не проходит ни через выражение workflow, ни через переменную shell. Версия без слоя —
            # заголовком раздела (так и сказано в тексте); нет раздела в отчёте — «НЕ УДАЛОСЬ».
            python3 -c 'import json,sys
          t=None
          try: t=json.load(open(sys.argv[1],encoding="utf-8"))["whats_new"]["text"]
          except Exception: pass
          if not isinstance(t,str) or not t.strip(): t="Что нового для вас: прочитать описание выпусков НЕ УДАЛОСЬ (раздела нет в отчёте обновления или он пуст) — это не «ничего нового»; см. CHANGELOG кита."
          t=t.strip()
          print(t if len(t)<=12000 else t[:12000].rstrip()+"\n\n… (обрезано — полный текст в CHANGELOG кита)")' "${REPORT:-/nonexistent}"
            echo
            # Раздел безопасности (#1157) — из ФАЙЛА отчёта, python читает его сам: текст с адресами
            # не проходит ни через `${{ }}`, ни через переменную shell, поэтому кавычки и `$()`
            # в нём остаются текстом. Нет отчёта или раздела — так и сказано, а не пропущено молча.
            echo '```text'
            # Не строка / пусто / нет файла -> «НЕ УДАЛОСЬ»: шаг идёт ПОСЛЕ push, падать ему нельзя.
            python3 -c 'import json,sys
          t=None
          try: t=json.load(open(sys.argv[1],encoding="utf-8"))["security_surface"]["text"]
          except Exception: pass
          if not isinstance(t,str) or not t.strip(): t="Что этот выпуск привозит по безопасности: проверить НЕ УДАЛОСЬ (раздела нет в отчёте обновления или он пуст) — это не «ничего»."
          print(t.replace("```","`​``").strip())' "${REPORT:-/nonexistent}"
            echo '```'
            if [ -n "$REPORT" ]; then
              echo; echo '<details><summary>update-report</summary>'; echo
              echo '```json'; cat "$REPORT"; echo '```'; echo '</details>'
            fi
          } > /tmp/pr-body.md
          gh pr create --title "chore: ai-ops update $FROM -> $TO" \
            --body-file /tmp/pr-body.md --base "${GITHUB_REF_NAME:-main}"
      - name: Авто-мерж патч-версии (если включено parent.auto_merge_patch)
        # ОПТ-ИН, ПО УМОЛЧАНИЮ ВЫКЛ. Сливается сам ТОЛЬКО патч (совпадают major.minor, растёт patch);
        # минор и мажор всегда остаются на ревью. `--auto` = слияние после обязательных проверок
        # ветки, а не мгновенно; без branch protection GitHub сольёт сразу — это ответственность
        # владельца, включившего флаг. Любая осечка (auto-merge не разрешён в репозитории, версия не
        # патч, флаг выкл) — не падение, а оставленный на ревью PR.
        if: steps.ver.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_OPS_PAT || github.token }}
          TO: ${{ steps.ver.outputs.available }}
          FROM: ${{ steps.ver.outputs.installed }}
        run: |
          AUTOMERGE=$(python3 -c "import yaml; print(str(yaml.safe_load(open('.ai-ops.yaml'))['parent'].get('auto_merge_patch', False)).lower())")
          if [ "$AUTOMERGE" != true ]; then echo "parent.auto_merge_patch выкл — PR остаётся на ревью"; exit 0; fi
          KIND=$(python3 -c "f=('$FROM'.lstrip('v').split('-')[0].split('+')[0].split('.')+['0','0','0'])[:3]; t=('$TO'.lstrip('v').split('-')[0].split('+')[0].split('.')+['0','0','0'])[:3]; print('patch' if f[0]==t[0] and f[1]==t[1] and int(t[2])>int(f[2]) else 'other')" 2>/dev/null || echo other)
          if [ "$KIND" != patch ]; then echo "обновление $FROM -> $TO не патч-версия — авто-мерж не для неё, PR остаётся на ревью"; exit 0; fi
          BRANCH="ai-ops/update-v$TO"
          echo "патч-версия $FROM -> $TO при auto_merge_patch=true — включаю авто-мерж (сольётся после обязательных проверок ветки)"
          gh pr merge "$BRANCH" --squash --auto \
            || echo "::notice::авто-мерж не включился — нужна защита ветки с обязательными проверками и разрешённый auto-merge в настройках репозитория; PR остаётся на ревью"
