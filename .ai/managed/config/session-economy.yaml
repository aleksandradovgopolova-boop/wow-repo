# config/session-economy.yaml — сколько кит имеет право потратить САМ, без человека в цикле.
#
# ПОЧЕМУ ЭТОТ ФАЙЛ ЗДЕСЬ, А НЕ В `.ai-ops.yaml`. У дочек потолок живёт в `.ai-ops.yaml ->
# session_economy`, но тот файл описывает связь «репозиторий ↔ кит», а у самого кита такой связи
# нет — он и есть кит (проверка самоприменения фиксирует это как «не применимо»). Без второго места
# автономия была бы навсегда недоступна ровно там, где её отлаживают. Файл дочки главнее: если он
# есть, этот НЕ читается (см. `session_launcher.load_ceiling`).
#
# ОТКУДА ВЗЯТО ЧИСЛО (13.08.2026). Владелец разрешил автономные подсессии и попросил «адекватную
# сумму», не называя её, — и это правильно: цену вызова видел только кит. Число выведено ЗАМЕРОМ, а
# не выбрано:
#   287 вызовов `claude -p` с ИЗМЕРЕННОЙ стоимостью (ledger дочек niti и ii-sreda),
#   медиана $0.39, p90 $0.79, максимум $1.10, суммарно потрачено $98.39;
#   потолок = 4 подсессии × p90 $0.79 = $3.17.
# p90, а не средняя: платить придётся за дорогие вызовы, а не за типичные. Пересчитать в любой
# момент: `session_launcher.suggest_ceiling(root, reference_roots=[...])`.
#
# ЧТО ЭТО ЗНАЧИТ НА ПРАКТИКЕ. Пока сумма не исчерпана, кит берёт подходящую работу в отдельную
# сессию сам. Исчерпал — останавливается и называет причину, а не тратит «ещё немного». Оба
# ограничения проверяются ДО вызова модели: превышения не бывает, бывает отказ.
#
# ЧЕГО ЭТОТ ПОТОЛОК НЕ ОГРАНИЧИВАЕТ (объявлено, не скрыто): расход интерактивной сессии человека.
# Его кит в деньгах не измеряет вообще — там работает потолок в токенах
# (`session_guardrails.session_token_budget`) и совет сменить сессию.
version: 1
session_economy:
  max_autonomous_spend_usd: 3.17
  max_subsessions_per_session: 4
