# coordination-files.yaml — файлы-КООРДИНАТОРЫ: их пишет ОДНА рука, а не каждая параллельная работа.
#
# ПОВОД ЗАМЕРЕН 20.08.2026 на самом ките. Четыре ленты строили операционный слой параллельно, и
# каждая дописывала свою работу в общий planning/plan.yaml. Конфликты были тривиальные (append), но
# дело не в них: защита ветки требует «ветка актуальна перед мержем», поэтому КАЖДЫЙ мёрж в main
# делал все остальные открытые PR DIRTY — беговая дорожка пересдач, растущая как N². Стоило это не
# одной пересдачи на работу.
#
# ПРАВИЛО. Перечисленные файлы — единый источник координации; их ведёт роль-координатор (в ките —
# ведущая сессия, в дочке — тот, кто владеет планом). Параллельная работа их НЕ трогает: свой код
# держит в своей write_scope, а изменение плана/истории/решений просит внести координатора ЛИБО
# кладёт вкладом-фрагментом (см. работу coordination-via-fragments). Так фичевый PR не трогает общий
# файл и не ловит DIRTY на каждый чужой мёрж.
#
# Дочка расширяет список СВОИМИ координаторами через .ai/project/coordination-files.yaml.
schema_version: 1
registry_type: coordination-files
paths:
  - planning/plan.yaml            # активный план работ — что взято, что следующее
  - history/plan-history.yaml     # закрытые работы с результатом
  - decisions/registry.yaml       # решения, принципы, исходы
  - registry/release-claims.yaml  # публичные числа/каналы релиза

# kit_update_markers — признаки install/update-PR кита (#384, замер 01.09.2026 на wow-repo). Апдейт
# САМ мигрирует план/историю, а первый заезд на голый репозиторий неизбежно вносит весь план-стор:
# эти координационные правки — вывод машинной миграции, а не рука параллельной ленты. Наличие любого
# из этих файлов в диффе означает, что PR машинный (одна рука), и смешение кода с координацией в нём
# DIRTY-дорожку N² не растит — гейт его пропускает. Без исключения parallel-safety по построению не
# пропускал бы НИ ОДИН апдейт кита с миграцией и НИ ОДИН первый заезд на новую дочку.
#
# Признак ДАННЫМИ здесь, а не хардкодом в validate_parallel_safety.py: реестр — источник истины, и
# дочка расширяет список своим `.ai/project/coordination-files.yaml` (например, свой managed-маркер).
# Если ключ отсутствует, валидатор откатывается к безопасному дефолту `.ai/managed/VERSION`.
kit_update_markers:
  - .ai/managed/VERSION           # managed-слой правит установщик апдейта; обычная работа его не трогает
