# registry/communication-policy.yaml — как AI Ops разговаривает с человеком (v3.35.0)
#
# ПРОБЛЕМА АРХИТЕКТУРНАЯ, А НЕ СТИЛИСТИЧЕСКАЯ. Внутренний язык системы слишком легко просачивается
# в пользовательский интерфейс: `preflight blocked: specification gate unresolved; ApprovalRecord
# missing for protected_paths; context payload 128k/150k` — это корректное внутреннее состояние и
# негодное сообщение человеку. Внутри кит и дальше говорит GateResult, write_scope, tested_revision;
# наружу между состоянием и человеком стоит ПЕРЕВОДЧИК.
#
#     внутреннее состояние -> Human Communication Layer -> сообщение человеку
#
# ПОЧЕМУ НЕ ОДНИМ СКИЛЛОМ. Скилл — правила хорошей коммуникации, и он полезен
# (`skills/plain-language-communication`). Но соблюдение не может зависеть от того, вспомнила ли
# конкретная модель его вызвать: тогда поведение теряется при смене runtime и в половине прогонов.
# Поэтому контракт `UserMessage` живёт ЗДЕСЬ и рендерится кодом (`ai_ops_kit/ui/presenter.py`), а
# скилл и инструкция для Claude Code — адаптеры поверх одного источника истины.
schema_version: 1
registry_type: communication-policy
contract_version: 1

# ── Четыре вопроса ────────────────────────────────────────────────────────────────────────────
# Каждое сообщение человеку отвечает максимум на четыре вопроса, в этом порядке. Больше четырёх
# разделов — это уже лог, а не сообщение.
message_contract:
  questions:
    - {id: summary,        asks: "Что произошло?",            required: true}
    - {id: why_it_matters, asks: "Почему это важно?",          required: false}
    - {id: next,           asks: "Что будет дальше?",          required: true}
    - {id: decision,       asks: "Нужно ли что-то от меня?",   required: false}
  order: [summary, why_it_matters, decision, next]
  order_note: >
    Решение стоит ПЕРЕД «что дальше»: человек, у которого спрашивают, должен увидеть вопрос до
    описания последствий, иначе он читает план, который ещё не согласован.
  technical_details: on_request
  technical_details_note: >
    Технические подробности не удаляются, а убираются за запрос. Удалить их значило бы сделать
    систему непроверяемой; показывать всегда — вернуть лог вместо сообщения.

# `label` — ЯРЛЫК, который человек видит первым словом сообщения. Он здесь, а не в коде: presenter
# держал свою копию словаря, и реестр перестал быть источником истины для собственного контракта
# (тир 3 разбора перед квалификацией). Ярлык — последнее средство: переводчик, у которого случай
# конкретнее общего статуса, обязан дать свой `headline` — «Работа продвинулась» на месте «ничего
# не идёт» трижды противоречило тексту рядом.
statuses:
  ok:              {label: "Готово",                   means: "работа продвинулась, от человека ничего не нужно"}
  needs_input:     {label: "Нужно твоё решение",       means: "нужно решение человека — без него продолжать нельзя"}
  blocked:         {label: "Пока не могу продолжить",  means: "продолжение невозможно по причине, которую человек может устранить"}
  done:            {label: "Готово",                   means: "результат готов и проверен"}
  degraded:        {label: "Готово, но проверено не всё", means: "результат есть, но часть проверок не доказана — сказать прямо"}

# ── Уровни детализации ────────────────────────────────────────────────────────────────────────
# Аудитория выбирается ОДИН раз (или фразой «рассказывай подробнее техническую часть»), а не
# каждым сообщением. `product` — default: система по умолчанию разговаривает с владельцем
# продукта, а не с отладчиком.
audiences:
  product:
    default: true
    for: [продакт, аналитик, основатель]
    explain_jargon: true
    show: [смысл, результат, решение, следующий шаг]
    hide: [gate id, SHA, ветки, команды, имена модулей, счётчики проверок, бюджеты]
    example_bad: "preflight blocked: specification gate unresolved; ApprovalRecord missing"
    example_good: >
      Пока не начинаю разработку: задача затрагивает защищённую часть проекта, нужно твоё
      подтверждение. Остальное к работе готово.
  technical:
    for: [разработчик, техлид]
    explain_jargon: false
    show: [файлы, API, ветки, тесты, архитектурные детали, имена гейтов]
    hide: [model routing, бюджеты, traces]
  debug:
    for: [отладка кита]
    explain_jargon: false
    show: [всё: gates, SHA, traces, model routing, budgets, commands]
    hide: []

default_audience: product
config_key: communication            # `.ai-ops.yaml -> communication.audience|mode|detail_level`

# ── Режимы работы: ЛИНЗА поверх аудитории, не новый продукт ──────────────────────────────────────
# Один kernel обслуживает разные роли (Product / Design / Engineering / Delivery / Founder) НЕ как
# отдельные продукты и НЕ новым словарём: режим — это тонкая линза, которая выбирает уровень
# детализации ПО УМОЛЧАНИЮ из трёх существующих аудиторий выше. Никаких новых аудиторий, никакой
# пер-режимной лексики: режим лишь называет типовую роль и её привычную подробность.
#
# Это обещанное продолжение `evaluation.audiences` (пять ролей, `status: partial` ниже): роли там
# перечислены как «следующий срез», и режимы — их первое РАБОТАЮЩЕЕ подключение через существующую
# машинерию, а не параллельная новая поверхность.
#
# Разрешение (в `presenter_core.audience_from_config`): явно заданная `communication.audience`
# ВСЕГДА побеждает; если аудитория не задана, но задан известный `mode` — берётся его аудитория
# по умолчанию; неизвестный/отсутствующий режим -> `default_audience` (product), та же дисциплина
# отката, что и у неизвестной аудитории. Режим НЕ вводит новый уровень и обязан отображаться в один
# из трёх существующих.
operating_modes:
  founder:     {audience: product,   rationale: "основатель смотрит на смысл и результат, а не на технику"}
  product:     {audience: product,   rationale: "владелец продукта: смысл, результат, решение, шаг"}
  design:      {audience: product,   rationale: "дизайн говорит о результате и опыте, не о гейтах и ветках"}
  delivery:    {audience: product,   rationale: "доставка: что готово и что мешает выпуску, продуктовым языком"}
  engineering: {audience: technical, rationale: "инженеру нужны файлы, тесты, ветки и имена гейтов"}

# ── Глоссарий продуктового языка ────────────────────────────────────────────────────────────────
# `hide` (выше) объявляет КАТЕГОРИИ терминов, которых продакт видеть не должен, — но категория сама
# по себе ничего не ловит. Дыра, найденная аудитом 04.09: заголовок работы (`title`) вставляется в
# `summary`/`next` дословно, и если он написан внутренним языком («coverage и footprint меряются
# против merge queue с auto-merge, а не polling» — это буквально `example_bad` по духу), продакт
# получает жаргон в чистом виде. Слоя перевода тут не было: presenter прятал `technical`-детали, но
# НЕ лексику внутри человеческих строк.
#
# Глоссарий — источник истины для маскировки: presenter (`_humanize`) прогоняет через него
# человеческие строки ТОЛЬКО для аудитории `product` (для `technical`/`debug` имена гейтов и метрик
# показываются — это их `show`-список). Перевод меняет ЯЗЫК, а не факты: термин заменяется плоским
# эквивалентом, а не вырезается. Ключи сопоставляются по границе слова, без учёта регистра, длинные
# фразы — раньше коротких («merge queue» до «merge»).
product_glossary:
  "merge queue": "очередь на слияние"
  "merge base": "итог слияния"
  "merge-base": "итог слияния"
  "pull request": "запрос на слияние"
  "auto-merge": "автослияние"
  "automerge": "автослияние"
  "write_scope": "область правок"
  "tested_revision": "проверенная версия"
  "GateResult": "результат проверки"
  "preflight_block": "предстартовая проверка"
  "ApprovalRecord": "запись согласования"
  "coverage": "покрытие тестами"
  "footprint": "объём поставки"
  "polling": "опрос состояния"
  "gate": "проверка"
  "SHA": "версия"
  # «PR» НЕ маскируется намеренно: в этом ките «verified PR» — продуктовый язык поставки (владелец
  # его и видит), а в `hide`-списке выше PR отсутствует. Аббревиатура коротка и всплывает внутри
  # человеческих заголовков — маскировать её значило бы портить смысл, а не убирать жаргон.

# ── Правила формулирования ────────────────────────────────────────────────────────────────────
# То, что скилл `plain-language-communication` объясняет словами, а presenter применяет кодом.
rules:
  - id: meaning-before-state
    rule: "Не начинать ответ с внутреннего состояния системы — начинать со смысла для человека."
  - id: translate-events
    rule: "Технические события переводить в последствия: не «gate failed», а что теперь нельзя и почему."
  - id: no-inventory
    rule: "Не перечислять файлы, SHA и команды без необходимости для решения."
  - id: explain-on-first-use
    rule: "Термин, которого не избежать, расшифровывать при первом употреблении."
  - id: collapse-successes
    rule: "Не показывать 15 успешных проверок, если достаточно «все проверки прошли»."
  - id: errors-as-consequences
    rule: "Ошибку объяснять через последствие, а не через место в коде."
  - id: ask-only-when-needed
    rule: "Вопрос задавать только тогда, когда действительно требуется решение человека."
  - id: recommend-not-enumerate
    rule: "Давать рекомендацию, а не список вариантов на выбор без совета."
  - id: details-on-request
    rule: "Технические подробности оставлять доступными по запросу, а не выкладывать сразу."
  - id: never-hide-degradation
    rule: >
      Простой язык НЕ означает сглаживание: недоказанное называется недоказанным. `degraded`
      существует именно для этого — «готово» вместо «готово, но не проверено» дороже любого
      жаргона.

# ── Описание выпуска: сообщение человеку, а не журнал (#1210) ─────────────────────────────────────
# Замер CHANGELOG кита: пункт до 1 732 знаков, ~27 минут чтения, «гейт» ×8, ни заглавного абзаца,
# ни «известных ограничений». Правило «одна-две фразы на языке результата» было прозой, и её никто
# не проверял. Здесь те же правила — ДАННЫМИ: их читает агент `release-manager` (по шаблону
# `templates/release/ReleaseNotes.md`) и проверяет машина, а не автор текста (writer ≠ judge).
#
# Два слоя. Слой А — короткое сообщение владельцу, пользователям и поддержке: что меняется для них.
# Слой Б — полный журнал для тех, кому нужны детали. Подробности уходят в Б, чтобы А не стал
# «простынёй». Порядок блоков слоя А = `block_order`; ключи `block_titles` идут в том же порядке.
release_notes:
  contract_version: 1
  template: templates/release/ReleaseNotes.md
  layer_a:
    max_words: 250                 # ≈ 2 минуты чтения
    max_item_chars: 200            # пункт — около 100–200 знаков; метка источника не считается
    max_whats_in_items: 3
    no_version_number: true        # в заглавном абзаце нет номера версии: человеку он ничего не говорит
    required_blocks: [headline, whats_in, known_limits, after_release, details]
    block_order: [headline, whats_in, behaviour_changes, who_is_affected, known_limits, after_release, details]
    block_titles:
      headline: "Что меняется для вас"
      whats_in: "Что вошло"
      behaviour_changes: "Что изменилось в привычном поведении"
      who_is_affected: "Кого касается"
      known_limits: "Известные ограничения"
      after_release: "Что сделать после выпуска"
      details: "Подробнее"
    # Жаргон, который словарь `product_glossary` выразить не может. Глоссарий presenter ПОДСТАВЛЯЕТ
    # слово в слово, без склонения и рода: «гейтов» -> «проверка», «блокирующий гейт» -> «блокирующий
    # проверка» портили бы сообщения кита. Поэтому русская калька и формы слова — здесь, шаблонами,
    # которые только ЛОВЯТ (проверка `validate_release_notes`), а не заменяют. Ключ ЗАМЕНЯЕТ
    # встроенные шаблоны проверки — первые два повторяют их. Замена для автора: гейт -> проверка,
    # ратчет -> предел, который только ужесточается, towncrier -> запись в журнал изменений,
    # allowlist -> список разрешённого.
    jargon_patterns:
      - '\b[A-Z]{1,4}\d{3,4}\b'                          # коды правил линтера: PLC2401, F821
      - '\b[A-Za-z][A-Za-z0-9]*(?:_[A-Za-z0-9]+)+\b'      # имена_через_подчёркивание: write_scope
      - '(?i)(?<!\w)гейт\w*'                              # гейт, гейты, гейтов, гейтом
      - '(?i)(?<!\w)р[аеэ]тч[еэ]т\w*'                     # ратчет, ретчет, ратчета
      - '(?i)(?<!\w)(?:towncrier|allowlist|denylist)(?!\w)'
    citation_exempt_blocks: [headline, details]   # заглавный абзац и ссылка на слой Б — без источника
    empty_block_value: "нет"       # «Известные ограничения» не опускаются: их отсутствие пишется словом
    breaking_first: true           # несовместимое — первым в «Что изменилось», с действием и сроком
    audiences: [владелец и бизнес, пользователи, поддержка]   # для кого слой А; подпункты «Кого касается»
  layer_b:
    title: "Полный журнал изменений"
    content: "все изменения выпуска, включая служебные, без сокращений"
  # Откуда что берётся. Польза, которой нет в источнике, — выдумка, а не описание выпуска.
  sources:
    whats_in: "фрагменты newsfragments/ и влитые работы выпуска"
    behaviour_changes: "фрагменты и влитые работы; несовместимое — из объявлений deprecated/breaking"
    known_limits: "недоказанное: статус degraded, непройденные и пропущенные проверки, фрагменты limit"
    after_release: "features/<id>/outcome-contract.yaml — метрика, окно наблюдения, правило решения"
  every_item_cites_source: true
  # Источник — в скобках в конце пункта: `(#123)`, `(self-reschedule.feat)`, `(#1183, lint-baseline)`.
  # Номер PR или имя фрагмента `newsfragments/` — не ради читателя, а чтобы пользу можно было сверить.
  source_marker: "(#PR | имя-фрагмента.тип[, …])"
  numbers_over_vague: true         # «за 1 с вместо 4 с», а не «быстрее»
  # Пустые фразы. Сопоставление — подстрокой без учёта регистра, поэтому здесь только то, что пусто
  # в ЛЮБОМ контексте: вместо них — что именно изменилось и насколько.
  banned_phrases:
    - "исправлены ошибки и улучшена стабильность"
    - "улучшена стабильность"
    - "повышена стабильность"
    - "различные улучшения"
    - "общие улучшения"
    - "мелкие улучшения"
    - "мелкие исправления"
    - "незначительные изменения"
    - "улучшен пользовательский опыт"
    - "оптимизирована работа"
    - "и многое другое"
    - "и другие улучшения"
  # Второй СЛОВАРЬ терминов не заводим: запретная лексика слоя А — ключи `product_glossary` выше;
  # `layer_a.jargon_patterns` дополняет его только тем, что словарь с заменой выразить не может.
  jargon_source: product_glossary
  tone:
    subordinate_to: never-hide-degradation
    rules:
      - "Тон и юмор — только поверх фактов: шутить можно о сделанном, но не о непроверенном и не об ограничениях."
      - "Недоказанное называется недоказанным и в описании выпуска: тон не превращает «не проверено» в «готово»."
      - "Обращение на «вы», действие вместо абстракции: «откройте → увидите», а не «реализована возможность»."
      - "Где уместно — «было → стало» с числом."

# ── Адаптеры ──────────────────────────────────────────────────────────────────────────────────
# Источник истины один — этот файл. Адаптеры его ТРАНСЛИРУЮТ, а не переопределяют: иначе при смене
# runtime поведение потерялось бы вместе с адаптером.
adapters:
  - id: presenter
    kind: code
    path: ai_ops_kit/ui/presenter.py
    note: "рендерит UserMessage под выбранную аудиторию; работает при любом runtime"
  - id: plain-language-skill
    kind: skill
    path: skills/plain-language-communication/SKILL.md
    note: "правила для модели, когда сообщение формулирует она, а не код"
  - id: claude-code-memory
    kind: runtime-instruction
    path: templates/runtime/claude-communication.md
    delivered_by: installer/ai_ops.py -> _install_communication_adapter
    delivered_to: CLAUDE.md репозитория (блок между маркерами AI-OPS-COMMUNICATION-POLICY)
    delivered_on: [init, update]
    note: >
      Блок в CLAUDE.md репозитория: Claude Code подхватывает его автоматически. Ставится и
      обновляется установщиком идемпотентно — текст вне маркеров не трогается. Адаптер, а не
      источник истины: при смене runtime политика остаётся здесь.
      v3.35 (ревью): прежде адаптер был ОБЪЯВЛЕН, но не доставлялся ничем — шаблон доезжал в
      managed-слой и в CLAUDE.md не попадал никогда. Поля `delivered_*` названы, чтобы следующий
      такой разрыв был видим в реестре, а не только в коде.

# ── Проверка ──────────────────────────────────────────────────────────────────────────────────
evaluation:
  what: >
    Один и тот же внутренний отчёт предъявляется слою и проверяется, способен ли он объяснить его
    разным аудиториям, НЕ теряя правду. Для продакта: «изменение готово, но выпуск рекомендовать не
    могу: новая схема данных ещё не проверена на тестовой базе». Для разработчика: «migration tests
    не подтверждены на integration DB». Для debug — полный gate/evidence.
  audiences: [product_manager, analyst, founder, developer, tech_lead]
  invariant: "перевод меняет ЯЗЫК, а не факты: `degraded` обязан остаться `degraded` во всех трёх"
  status: partial
  status_note: >
    Контракт и presenter реализованы и покрыты тестами; корпус eval-кейсов на пять аудиторий —
    объявленный следующий срез, а не сделанное. Заявлять его сделанным было бы ровно тем, что
    инварианты кита запрещают. Первый РАБОТАЮЩИЙ шаг к пяти ролям сделан выше (`operating_modes`):
    режимы отображают эти роли на три существующие аудитории через ту же машинерию. Полный корпус
    eval-кейсов на пять аудиторий по-прежнему остаётся `partial` — режимы его не заменяют.
