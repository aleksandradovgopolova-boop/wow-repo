# registry/communication-policy.yaml — как AI Ops разговаривает с человеком (v3.35.0)
#
# ПРОБЛЕМА АРХИТЕКТУРНАЯ, А НЕ СТИЛИСТИЧЕСКАЯ. Внутренний язык системы слишком легко просачивается
# в пользовательский интерфейс: `preflight blocked: specification gate unresolved; ApprovalRecord
# missing for protected_paths; context payload 128k/150k` — это корректное внутреннее состояние и
# негодное сообщение человеку. Внутри кит и дальше говорит GateResult, write_scope, tested_revision;
# наружу между состоянием и человеком стоит ПЕРЕВОДЧИК.
#
#     внутреннее состояние -> Human Communication Layer -> сообщение человеку
#
# ПОЧЕМУ НЕ ОДНИМ СКИЛЛОМ. Скилл — правила хорошей коммуникации, и он полезен
# (`skills/plain-language-communication`). Но соблюдение не может зависеть от того, вспомнила ли
# конкретная модель его вызвать: тогда поведение теряется при смене runtime и в половине прогонов.
# Поэтому контракт `UserMessage` живёт ЗДЕСЬ и рендерится кодом (`ai_ops_kit/ui/presenter.py`), а
# скилл и инструкция для Claude Code — адаптеры поверх одного источника истины.
schema_version: 1
registry_type: communication-policy
contract_version: 1

# ── Четыре вопроса ────────────────────────────────────────────────────────────────────────────
# Каждое сообщение человеку отвечает максимум на четыре вопроса, в этом порядке. Больше четырёх
# разделов — это уже лог, а не сообщение.
message_contract:
  questions:
    - {id: summary,        asks: "Что произошло?",            required: true}
    - {id: why_it_matters, asks: "Почему это важно?",          required: false}
    - {id: next,           asks: "Что будет дальше?",          required: true}
    - {id: decision,       asks: "Нужно ли что-то от меня?",   required: false}
  order: [summary, why_it_matters, decision, next]
  order_note: >
    Решение стоит ПЕРЕД «что дальше»: человек, у которого спрашивают, должен увидеть вопрос до
    описания последствий, иначе он читает план, который ещё не согласован.
  technical_details: on_request
  technical_details_note: >
    Технические подробности не удаляются, а убираются за запрос. Удалить их значило бы сделать
    систему непроверяемой; показывать всегда — вернуть лог вместо сообщения.

# `label` — ЯРЛЫК, который человек видит первым словом сообщения. Он здесь, а не в коде: presenter
# держал свою копию словаря, и реестр перестал быть источником истины для собственного контракта
# (тир 3 разбора перед квалификацией). Ярлык — последнее средство: переводчик, у которого случай
# конкретнее общего статуса, обязан дать свой `headline` — «Работа продвинулась» на месте «ничего
# не идёт» трижды противоречило тексту рядом.
statuses:
  ok:              {label: "Готово",                   means: "работа продвинулась, от человека ничего не нужно"}
  needs_input:     {label: "Нужно твоё решение",       means: "нужно решение человека — без него продолжать нельзя"}
  blocked:         {label: "Пока не могу продолжить",  means: "продолжение невозможно по причине, которую человек может устранить"}
  done:            {label: "Готово",                   means: "результат готов и проверен"}
  degraded:        {label: "Готово, но проверено не всё", means: "результат есть, но часть проверок не доказана — сказать прямо"}

# ── Уровни детализации ────────────────────────────────────────────────────────────────────────
# Аудитория выбирается ОДИН раз (или фразой «рассказывай подробнее техническую часть»), а не
# каждым сообщением. `product` — default: система по умолчанию разговаривает с владельцем
# продукта, а не с отладчиком.
audiences:
  product:
    default: true
    for: [продакт, аналитик, основатель]
    explain_jargon: true
    show: [смысл, результат, решение, следующий шаг]
    hide: [gate id, SHA, ветки, команды, имена модулей, счётчики проверок, бюджеты]
    example_bad: "preflight blocked: specification gate unresolved; ApprovalRecord missing"
    example_good: >
      Пока не начинаю разработку: задача затрагивает защищённую часть проекта, нужно твоё
      подтверждение. Остальное к работе готово.
  technical:
    for: [разработчик, техлид]
    explain_jargon: false
    show: [файлы, API, ветки, тесты, архитектурные детали, имена гейтов]
    hide: [model routing, бюджеты, traces]
  debug:
    for: [отладка кита]
    explain_jargon: false
    show: [всё: gates, SHA, traces, model routing, budgets, commands]
    hide: []

default_audience: product
config_key: communication            # `.ai-ops.yaml -> communication.audience|detail_level`

# ── Правила формулирования ────────────────────────────────────────────────────────────────────
# То, что скилл `plain-language-communication` объясняет словами, а presenter применяет кодом.
rules:
  - id: meaning-before-state
    rule: "Не начинать ответ с внутреннего состояния системы — начинать со смысла для человека."
  - id: translate-events
    rule: "Технические события переводить в последствия: не «gate failed», а что теперь нельзя и почему."
  - id: no-inventory
    rule: "Не перечислять файлы, SHA и команды без необходимости для решения."
  - id: explain-on-first-use
    rule: "Термин, которого не избежать, расшифровывать при первом употреблении."
  - id: collapse-successes
    rule: "Не показывать 15 успешных проверок, если достаточно «все проверки прошли»."
  - id: errors-as-consequences
    rule: "Ошибку объяснять через последствие, а не через место в коде."
  - id: ask-only-when-needed
    rule: "Вопрос задавать только тогда, когда действительно требуется решение человека."
  - id: recommend-not-enumerate
    rule: "Давать рекомендацию, а не список вариантов на выбор без совета."
  - id: details-on-request
    rule: "Технические подробности оставлять доступными по запросу, а не выкладывать сразу."
  - id: never-hide-degradation
    rule: >
      Простой язык НЕ означает сглаживание: недоказанное называется недоказанным. `degraded`
      существует именно для этого — «готово» вместо «готово, но не проверено» дороже любого
      жаргона.

# ── Адаптеры ──────────────────────────────────────────────────────────────────────────────────
# Источник истины один — этот файл. Адаптеры его ТРАНСЛИРУЮТ, а не переопределяют: иначе при смене
# runtime поведение потерялось бы вместе с адаптером.
adapters:
  - id: presenter
    kind: code
    path: ai_ops_kit/ui/presenter.py
    note: "рендерит UserMessage под выбранную аудиторию; работает при любом runtime"
  - id: plain-language-skill
    kind: skill
    path: skills/plain-language-communication/SKILL.md
    note: "правила для модели, когда сообщение формулирует она, а не код"
  - id: claude-code-memory
    kind: runtime-instruction
    path: templates/runtime/claude-communication.md
    delivered_by: installer/ai_ops.py -> _install_communication_adapter
    delivered_to: CLAUDE.md репозитория (блок между маркерами AI-OPS-COMMUNICATION-POLICY)
    delivered_on: [init, update]
    note: >
      Блок в CLAUDE.md репозитория: Claude Code подхватывает его автоматически. Ставится и
      обновляется установщиком идемпотентно — текст вне маркеров не трогается. Адаптер, а не
      источник истины: при смене runtime политика остаётся здесь.
      v3.35 (ревью): прежде адаптер был ОБЪЯВЛЕН, но не доставлялся ничем — шаблон доезжал в
      managed-слой и в CLAUDE.md не попадал никогда. Поля `delivered_*` названы, чтобы следующий
      такой разрыв был видим в реестре, а не только в коде.

# ── Проверка ──────────────────────────────────────────────────────────────────────────────────
evaluation:
  what: >
    Один и тот же внутренний отчёт предъявляется слою и проверяется, способен ли он объяснить его
    разным аудиториям, НЕ теряя правду. Для продакта: «изменение готово, но выпуск рекомендовать не
    могу: новая схема данных ещё не проверена на тестовой базе». Для разработчика: «migration tests
    не подтверждены на integration DB». Для debug — полный gate/evidence.
  audiences: [product_manager, analyst, founder, developer, tech_lead]
  invariant: "перевод меняет ЯЗЫК, а не факты: `degraded` обязан остаться `degraded` во всех трёх"
  status: partial
  status_note: >
    Контракт и presenter реализованы и покрыты тестами; корпус eval-кейсов на пять аудиторий —
    объявленный следующий срез, а не сделанное. Заявлять его сделанным было бы ровно тем, что
    инварианты кита запрещают.
