  # 16.09.2026. ПЕРВОЕ полевое доказательство минора 4.4 (ии-среда). Для промоута 4.4 в stable нужен
  # ВТОРОЙ живой репо на 4.4 — пока только один, поэтому канал остаётся qualification.
  - repo: ii-sreda
    version: 4.4.2
    date: '2026-09-16'
    outcome: ok
    how: >-
      Обновление до 4.4.2 приехало ПО ПОЛИТИКЕ дочки (`update_policy: pr`, канал `qualification`): PR
      #877 (update AI Ops Kit → 4.4.2), managed-слой целостен. На этой установке (тег, не PYTHONPATH)
      владелец провёл живой прогон — несколько реальных фич через кит, кит нигде не показал технику;
      проверка `storybook-preview` (падавшая на старом шаблоне) зелёная. Полевые фиксы v4.4.1/v4.4.2
