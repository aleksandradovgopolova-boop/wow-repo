# release-claims.yaml — machine-readable claims о ТЕКУЩЕМ релизе + runtime-статусах (v3.8.1 Release Truth
# Alignment). ЕДИНСТВЕННЫЙ источник публичных чисел/статусов; validate_release_claims.py (в CI) ловит дрейф
# между этим файлом и фактическим состоянием (VERSION, python3-проверки в AGENTS.md, registry/agents.yaml,
# registry/runtimes.yaml) И требует, чтобы README/ROADMAP ссылались на текущую версию. ОБНОВЛЯТЬ при релизе.
schema_version: 1
registry_type: release-claims

version: 4.9.2
# Поле `phase` УБРАНО (04.09.2026, лента release-metadata). Это была свободная проза релиза, которая
# дублировала заголовок раздела CHANGELOG. `release_bump` бампает ЧИСЛО версии по всем поверхностям и
# пишет заголовок CHANGELOG из `--title`, но `phase` не трогал, а `validate_release_claims` проверяет
# числа/ссылки, не прозу — поэтому `phase` молча застрял на «v3.39.2» при version 4.0.0. Заявление о
# том, ЧТО в релизе, живёт в одном месте — заголовке CHANGELOG (и `patch_note` в release-notes.yaml);
# второй незапроверяемой копии здесь быть не должно. Ни код, ни валидатор, ни схема поле не читали.
# КАНАЛ ЗАРАБАТЫВАЕТСЯ, А НЕ ОБЪЯВЛЯЕТСЯ (F-030, по внешнему ревью 12.08.2026).
#
# До этой правки здесь стояло `channel: stable`, и не проверял его НИКТО. Слово было
# самообъявлением — тот же класс, против которого стоит весь кит. Цена замерена в тот же день: тег
# v3.36.9 был выпущен как `stable` и содержал P1 (F-022 — политика обновлений не исполнялась),
# исправленный через час после релиза. Дочки при этом получили именно тег.
#
# Теперь `stable` требует ПОЛЕВЫХ доказательств на этой самой версии, и это проверяет
# `validate_release_claims`. Критерии ниже машиночитаемы; менять их — осознанное решение владельца,
# а не правка строки.
#
# 2026-09-16 (v4.4.0): свежий минор 4.4 (P0-кампания продуктового ревью) в поле НЕ обкатан —
# field_evidence для минора 4.4 пусто, поэтому честный канал тега v4.4.0 — `qualification` (свой CI
# зелёный, в дочки не обкатан). Минор 4.3 остаётся заработанным stable по своим тегам (cockpit +
# live-587, ниже), и дочки на stable-политике продолжают резолвиться на 4.3.x. Промоут 4.4 в stable —
# после живого внешнего прогона (P0 №7 направления one-feature-end-to-end), который и даст field_evidence.
channel: qualification
channels:
  edge:
    what: "то, что влито в main; лучший известный код, но без гарантий"
    requires: []
  qualification:
    what: "выпущен тег, собственный контур зелёный; в дочки ещё не обкатан"
    requires: [own_ci_green]
  stable:
    what: "обкатан в поле: обновление доехало до живых дочек и там ничего не сломало; продуктовый слой реализован"
    requires: [own_ci_green, field_evidence, product_layer_ready]
    field_evidence_min_repos: 2
    # ep-2026-08-20-stable-includes-product-operating-layer: stable не объявить, пока пять целей
    # Product OS (product-operating-layer, backlog-intelligence, roadmap-and-delivery,
    # ai-product-operations, autonomous-product-loop) не достигнуты. «Канал заработан» и
    # «продукт-как-ОС готов» — один рубеж.
    product_layer_goals:
      - product-operating-layer
      - backlog-intelligence
      - roadmap-and-delivery
      - ai-product-operations
      - autonomous-product-loop

# НАЗВАННОЕ МЕНЮ стратегий доставки обновления в дочку. Дочка выбирает ОДНУ в .ai-ops.yaml ->
# parent.update_strategy; резолвер `resolve_update_strategy` (installer/ai_ops.py) читает выбор и
# СВОЙСТВА стратегии отсюда. Это ДЕКЛАРАЦИЯ, а не поведение: кит лишь НАЗЫВАЕТ доступные стратегии
# и сообщает, какую выбрал владелец. Актуатор, который сам применяет обновление к чужому
# репозиторию, здесь НЕ объявляется и не строится — `pr`/`manual` исполняет установщик по решению
# владельца, `scheduled-batch`/`auto-stable` пока только названы.
update_strategies:
  pr:                    # ДЕФОЛТ: отсутствие выбора читается как pr.
    what: "обновление готовится как PR на ревью владельца"
    default: true
  manual:
    what: "владелец применяет обновление сам"
  scheduled-batch:
    what: "обновления группируются и открываются одним PR по расписанию — тоже под ревью владельца"
  auto-stable:
    # ДЕКЛАРАЦИЯ свойства, не автоприменение. Доступна ТОЛЬКО когда пакет заработал канал stable
    # И владелец включил её явно (parent.update_strategy_opt_in: true). По умолчанию выключена.
    what: "автоприменение из канала stable; требует stable-канал и явного включения владельцем"
    requires_channel: stable
    enabled: false

# ПОЛЕ, а не намерение. Запись сюда означает: эта версия реально доехала до этого репозитория и
# результат известен. Пустой список — нормальное состояние свежего патча, и оно ЧЕСТНЕЕ, чем
# `stable` без основания.
field_evidence:
  # 20.08.2026. Первая запись за всё время: до сегодня список был пуст, и это значило, что ни одна
  # версия не была обкатана в поле ВООБЩЕ — `stable` не мог наступить не из-за строгости критерия,
  # а из-за отсутствия хоть одного доказательства.
  - repo: ai-ops-cockpit
    version: 3.36.12
    date: '2026-08-20'
    outcome: ok
    how: >-
      Обновление 3.36.10 -> 3.36.12 приехало ПО ПОЛИТИКЕ дочки (`update_policy: pr`): подготовлено в
      ветке `ai-ops/update-v3.36.12`, рабочее дерево владельца не тронуто, PR #48 зелёный и слит.
      После обновления managed-слой целостен (561 файл сверен с .checksums.json), `validate_ai_ops_child`
      OK, движок отвечает (`next` даёт следующую работу с названной причиной).
    caveat: >-
      Два замечания `doctor` РАЗОБРАНЫ и находками НЕ являются: оба — расхождение версий между
      локальным клоном кита (main) и установленной дочкой (3.36.12), а не дефект. Замечания на
      «конфиг дочки не проверен» и «шаблоны CI старее кита» проверялись отдельно: валидатор
      появился ПОСЛЕ тега, шаблоны в теге свои. Проверено до того, как названо находкой — тот же
      разбор, что и весь день.
  # 01.09.2026. Раскатка v3.39.0 на две оставшиеся дочки — второе доказательство поля.
  - repo: ai-ops-cockpit
    version: 3.39.0
    date: '2026-09-01'
    outcome: ok
    how: >-
      Обновление 3.38.0 -> 3.39.0 приехало ПО ПОЛИТИКЕ дочки (`update_policy: pr`, канал
      `qualification`): установщик подготовил ветку `ai-ops/update-v3.39.0`, рабочее дерево владельца
      и чужие worktree фич не тронуты, PR #55 зелёный (validate+record) и слит. На origin/main
      VERSION = 3.39.0, managed целостен, кодовый фикс приёмки (Fix C) на месте.
  - repo: wow-repo
    version: 3.39.0
    date: '2026-09-01'
    outcome: ok
    how: >-
      ПЕРВЫЙ заезд кита на `main`, где кита не было вовсе (origin/main — предок ветки, слияние
      чистое). Обновление 3.36.8 -> 3.39.0 применено на ветку PR #11; wow-repo осознанно переведён
      stable -> qualification как второй ранний получатель. PR #11 зелёный по обязательным проверкам
      и слит; VERSION на origin/main = 3.39.0, продуктовый слой `.ai-ops/` создан.
    caveat: >-
      Всплыл дефект #384: гейт parallel-safety валит апдейт-PR за смешение кода с координационными
      planning/plan.yaml + history/ (их вносит миграция плана внутри update). Обошли вручную —
      координационные вынесены из код-PR, план-стор заведён отдельным координаторским PR #12. Заезд
      СОСТОЯЛСЯ, но не полностью автоматически: ручной шаг на каждую голую дочку до починки #384.
  # 14.09.2026. Раскатка v4.3.0 на две живые дочки — доказательство поля для мажора 4.x.
  - repo: ai-ops-cockpit
    version: 4.3.0
    date: '2026-09-14'
    outcome: ok
