 не производились ничем (user_confirmed, адаптер claude-code-memory) — теперь у обоих есть производитель, и валидатор ТРЕБУЕТ delivered_by от любой runtime-instruction. Страж полноты покрытия валидаторов сканировал корневой validation/, которого нет с 3.34 — множество пустое, assert не мог провалиться; путь исправлен, охват 0 в 72. Одиннадцатая найдена живой проверкой: точный путь сильнее чужого glob, иначе корректное обновление модели данных давало ложную находку, а гейт с шумом перестают читать. Валидаторов 71 в 72, интентов 12 в 14, гейтов 33 в 34, тестов 1467 в 1667. Доказательство 3.35: охват full-current-python (CPython 3.9.6/darwin) — 1667 passed, 6 skipped; охват compatibility-matrix — CI (python39-compat, pipeline-e2e 3.9/3.12, clean-install зелёные на PR 42 и 44). 3.34.0 — Distribution Boundary Cleanup. Три пункта, значившиеся «объявлено, но не закрыто». (1) РОДОВОЕ ИМЯ: validation/ переехал в ai_ops_kit/validation/ (76 файлов), в колесе два top-level имени вместо трёх — держит ратчет на состав имён, не декларация. tools остаётся отдельным срезом. Раскладка child зеркалит кит: миграция 3.33-to-3.34 (up+down, идемпотентна), обёрток на старом пути нет сознательно. Валидаторы объявлены ЗОНОЙ-ИСКЛЮЧЕНИЕМ из инвариантов пакетной чистоты: они двурежимны, их запускают процессом, и корня на sys.path в этом режиме нет; 76 алиасов в tools/ раздули бы СЛЕДУЮЩЕЕ родовое имя ради чистоты предыдущего. Зона одна, в ней только точки входа, список не-валидаторов вправе только сокращаться, причина исключения проверяется фактом. ai_route — движок маршрутизации, а не валидатор — годами лежал среди валидаторов и импортировался плоско из workitem/run_plan; переехал в engine, страж ловит следующий такой модуль сразу. Настоящий pip install снова оказался единственной проверкой, увидевшей цену решения: 10 валидаторов не импортировались как модули пакета, а движок зовёт часть из них библиотекой; импорт _bootstrap стал двурежимным, 30 плоских импортов переведены на пакетные, 170 модулей из 170. Перенос доловили сами валидаторы (references/claims/release-claims/security-posture), а validate_research_artifacts считал корень двумя dirname вместо маркера VERSION — глубина совпадала, пока каталог не переехал. (2) ЗАМЕР СТАЛ ПОТОЛКОМ и по дороге исправлен: опубликованные «119 циклов» — это 31 цикл, посчитанный по разу с каждой вершины (11 троек, 14 четвёрок, 6 пятёрок = 33+56+30). Проверено на трёх деревьях: граф с 3.31.1 не менялся, число всегда означало не то, что написано рядом. Потолком может быть только величина, не зависящая от способа обхода. Ратчет ходит только ВНИЗ: превышение краснеет, снижение тоже и требует опустить потолок; baseline без числа — ошибка, а не «ограничений нет». Ратчет сработал на собственном срезе: 12 пар и 210 циклов после переноса validation, но связей не прибавилось — у этих рёбер не было вершины. Единственная настоящая новая пара engine<->lifecycle: workitem зависит от маршрутизации. (3) ОХВАТ ДОКАЗАТЕЛЬСТВА: check-full.sh — это full-current-python, а не compatibility-matrix; PR #38 написал «полный контур зелёный», и python39-compat опроверг это в том же релизе. evidence_scopes объявляет оба охвата с полем does_not_cover (охват без границы — снова «полный»), validate_release_claims требует, чтобы заявление о полноте называло охват, скрипт печатает свой охват до и после прогона. Первым проверка поймала настоящее заявление в patch_note 3.33.2. Доказательство 3.34: охват full-current-python (CPython 3.9.6/darwin) — 1467 passed, 6 skipped; check-clean-install — 170/170 модулей, child зелёный; охват compatibility-matrix — CI. 3.33.3 — 3.33.1 убрал из setup.py запись .pth-пояса в site-packages, но пояса, уже написанные на машинах, никуда не делись: файл лежит вне репозитория и вне учёта pip, поэтому ни обновление пакета, ни git pull его не касаются. Замерено, что он прятал: test_missing_bootstrap_is_caught копирует репозиторий, удаляет там validation/_bootstrap.py и ждёт ModuleNotFoundError — с поясом импорт находил _bootstrap в НАСТОЯЩЕМ репозитории, и fail-closed-проверка теряла зубы, оставаясь зелёной; переменной среды это не снять, .pth исполняется до первой строки кода. ai-ops doctor получил проверку гигиены путей первой строкой и БЛОКИРУЮЩУЮ: если окружение врёт, всё напечатанное ниже ничего не доказывает. Различаются два происхождения с разным лечением — path_belt (blocking, писал сам кит, pip его не заберёт: файла нет в RECORD) и editable_in_user_site (advisory, снимает pip); editable в venv находкой не считается. Пояс отличается от установки ХОЗЯИНОМ файла, а не формой содержимого: editable в режиме editable_mode=compat пишет обычную строку пути, ровно как пояс, поэтому файлы из RECORD и названные по схеме setuptools под удаление не попадают никогда. Граница проверки объявлена в отчёте (scan_limits), а «ни один каталог не просмотрен» даёт статус unknown, а не clean: не знаю не выдаётся за чисто. Подчищать автоматически решено НЕ будем и это объявлено границей: pip не может (нет хука uninstall и файла в RECORD), installer не должен (молча удалять файлы вне своего окружения — тот же дефект, что молча их писать, именно эта вольность пояс и создала); лечение явное — doctor --remove-path-belt. Контуры проверки предупреждают о поясе ДО прогона, а check-clean-install доказывает снимком до/после, что установка пояса не пишет. 3.33.2 — закрыты три долга, до сих пор значившиеся «известно и не запрещено». (1) test_execution_pipeline_selftest был зелёным ОТ ВЕРСИИ GIT: он неявно зависел от того, переживёт ли каталог src/ переключение веток, а git не хранит пустые каталоги; локально (2.43) исчезал, в CI (2.54) переживал. Крах прятал второе падение — реальное: _change_context усекает дифф на 12000 символов, коммит распухал от артефактов прогонов, и ТЕЛО правки в контекст ревьюера не попадало. Продуктового дефекта за этим нет: реальный прогон с изоляцией коммитит ровно изменённый файл (замерено). (2) Родовые имена tools и validation в site-packages объявлены standing boundary с ратчетом на состав top-level имён: убрать их нельзя, пока код зовёт валидаторов по плоскому имени, а честное решение — перенос validation/ под ai_ops_kit/ — отдельный срез. (3) Инвариант трёх колец СТАЛ проверяемым: аналитика (product_health, effect_metrics, evolution_triggers) вынесена в пакет intelligence слоем выше ядра, зависимость вверх запрещена. Перенос безопасен по замеру — эти модули не импортировал никто; кольцо соблюдалось де-факто, не хватало границы. Инвариант односторонний: intelligence вправе читать ядро, это закреплено отдельным тестом. unverifiable_today пуст, verified_invariants не пуст, оба факта проверяются. Полный контур зелёный целиком впервые с 3.30.0. 3.33.1 — ХОТФИКС: заявление 3.33.0 было доказано ИМИТАЦИЕЙ sys.path, и настоящий pip install тут же показал сломанный модуль и причину, по которой такие поломки не видны. setup.py на уровне модуля писал .pth в site-packages ПОЛЬЗОВАТЕЛЯ, подкладывая корень, tools/ и validation/ в каждый процесс Python на машине: файл писался даже при установке в venv, путь зашивался абсолютный от каталога сборки, а главное — это и есть пояс, прячущий дефекты, который репозиторий весь август чинил в других местах и ставил себе сам на любом pip install. Убрано; пути кит находит в рантайме по маркеру VERSION, проверено установкой в venv (95 модулей из 95). Девять модулей звали валидаторов по плоскому имени, не положив пути, — восемь работали случайно, за счёт соседа. Проверка 3.33.0 имела ту же дыру, что и код: импортировала все 95 модулей в ОДНОМ процессе, и первый же чинил sys.path за остальных; теперь процесс на модуль. В clean-install добавлен шаг с настоящим pip install — прежде дистрибутив не проверялся вовсе. 3.33.0 — вторая половина переезда: 257 внутренних импортов переведены с плоских имён на пакетные, и по дороге выяснилось, что пакет не импортировался КАК ПАКЕТ: с одним корнем на sys.path (то есть после pip install) любой модуль падал с ModuleNotFoundError по _bootstrap, потому что shared/_bootstrap был алиасом и искал плоский модуль в tools/. Теперь ищет корень маркером VERSION; проверка ставит sys.path в состояние пользователя, выбрасывая всё внутри репозитория. Формы импорта сохранены буквально (import X -> from ai_ops_kit.<пакет> import X): при 119 циклах форма from ... import name требует полностью инициализированного модуля. Две проверки ослепли на новой форме и это поймано: validate_layering видел 4 ребра из 49, repo_graph снова терял импортёров в --impact. 3.32.0 — границы 12 пакетов перестали быть только именами: validate_layering считает граф импортов по коду (плоские и пакетные имена) и сверяет с packages/layering.yaml. Слои: foundation (shared) -> primitives (security, ui) -> capabilities (ядро) -> entrypoints (cli, devtools). Честная граница первого шага: запрещено то, что сегодня не нарушено и должно таким остаться (security/ui выше фундамента, зависимости у shared, импорт cli/devtools, продуктовый код -> devtools); взаимные связи ВНУТРИ ядра не запрещены — замер 9 взаимных пар и 119 циклов, строгий DAG покраснел бы на всём сразу и его бы выключили. Реестр исключений вправе только сокращаться: протухшее разрешение ловится тестом. Инвариант трёх колец объявлен НЕПРОВЕРЯЕМЫМ сегодня и записан как таковой: lifecycle держит и ядро, и аналитику. 3.31.1 — ХОТФИКС к 3.31.0: переезд в пакеты сделал молчаливым no-op ВСЕ 94 точки входа. Алиас делал sys.modules[__name__] = _target, то есть при запуске скриптом подменял собой __main__ — main-guard в цели не срабатывал, скрипт не делал ничего и возвращал 0. Под ударом весь командный слой child-репозитория (/ai-start-task гоняет tools/run_plan.py, workitem.py, worktree.py, active_work.py). Запуск скриптом идёт через runpy, критерий проверки — непустой вывод, а НЕ rc=0: именно ноль дефект и пережил. Вторым закрыт разрыв поставки: validation/_bootstrap.py из 3.31.0 не попадал в child (белый список перечисляет валидаторы, а это их загрузчик) — уехавшие валидаторы падали на первой строке. Добавлен прогон установки в чистом окружении (scripts/check-clean-install.sh + джоба CI, где стоит только pyyaml): кит проверяется там, где нет ни кита, ни pytest, ни PYTHONPATH. 3.31.0 — код движка переехал в ai_ops_kit/* (95 модулей, 12 пакетов); плоские имена остались алиасами через sys.modules — ОДИН объект модуля, поэтому 661 импорт и входные точки doctor не тронуты. Вынос selftest из продакшн-модулей ЗАВЕРШЁН (в 3.30.0 был пилот): 26% -> 0, продакшн 49 227 -> 24 669 строк, поставка 3.01 -> 2.52 МиБ. Контур проверки сведён к одной команде ./scripts/check-full.sh: чеклист 205 -> 0 команд, группы CI 7 -> 4, быстрый цикл 4:40 -> 1:03. Переезд поймал две регрессии, невидимые быстрому профилю: загрузка модулей ПО ПУТИ обходит подмену sys.modules, а repo_graph сканировал только tools/ и терял реальных импортёров в --impact. Отдельно закрыт дефект, который CI не видел: десять validation/*.py делали голый import _bootstrap, резолвившийся только через PYTHONPATH из workflow или editable-установку — в свежем child-репозитории валидатор падал с ModuleNotFoundError; проверка на это чистит PYTHONPATH, иначе она проверяла бы среду, а не код. Гейт regression_test_evidence остаётся advisory — переключение в blocking после живого раунда."

# Числа сверяются ДЕРИВИРОВАННО (не на слово): checks_count = python3-команды в pre-commit-checklist.md;
# agents_count = записи в registry/agents.yaml. Устаревшие числа (напр. «91+») CI отклонит.
checks_count: 0
agents_count: 51
# Числа гейтов — DERIVED. ПОПРАВКА к формулировке v3.28.x: claim'ы gate-count/mvp-blocking-count,
# на которые ссылается ROADMAP, существуют — они в knowledge/claims.yaml и их проверяет
# validate_claims. Здешние счётчики их ДУБЛИРУЮТ по значению, но добавляют то, чего там нет:
# требование blocking: true у каждого гейта из mvp_blocking_gates (список блокеров без силы —
# такая же ложь публичной поверхности, как устаревшее число). При изменении числа гейтов править
# ОБА места: knowledge/claims.yaml (pattern-счётчик) и этот файл.
gates_count: 34
mvp_blocking_count: 8
# Верификация самих валидаторов (рекомендация №6 внешнего ревью). Число деривируется из tests/ и
# обязано совпадать: и рост, и просадка покрытия требуют осознанной правки этого файла.
# ВАЖНО про глубину: 70/70 значит «есть внешний тест», а НЕ «покрыт одинаково глубоко».
# 28 — контракт check(data): форма, fail-closed на чужом артефакте, читаемость сообщений;
# 33 — рантайм-контракт: зелёный из копии репозитория / отказ без артефакта, из них 9 краснеют
#      на РЕАЛЬНОЙ порче своего источника правды;
#  9 — штучные тесты (security_domains, spec_coverage, workflow_gates, installer-группа и др.);
#  +1 — validate_layering (v3.32.0): граф импортов между пакетами против layering.yaml.
validators_count: 72
validators_externally_tested: 72

qualified_on: >
  provider-neutral портфель по РОЛЯМ: дешёвый API-writer (money-mode) + СИЛЬНЫЙ writer (локальный
  claude -p, без ключа) на сложном full-stack + независимый дешёвый ревьюер (deepseek, writer≠judge)
  + ЧЕЛОВЕК на strict security #5. Sonnet НЕ требуется. Доказано live end-to-end (draft PR на ИИ-Среде).

# Публичная поверхность обязана ссылаться на текущую версию (иначе рассказывает о прошлом продукте).
docs_must_reference_version: [README.md, ROADMAP.md]

# v3.36.1: «версия встречается где-то в файле» — НЕ проверка. ROADMAP говорил в шапке «текущий
# канал — v3.34.0 stable» и одновременно содержал ниже раздел про 3.36: подстрока находилась,
# заявление врало, и релиз 3.36.0 прошёл валидатор с обоими утверждениями сразу. Читаем ИМЕННО ту
# строку, которая объявляет текущий канал. Пропажа образца — тоже ошибка: ослепшая проверка хуже
# отсутствующей.
authoritative_version:
  - {file: README.md,  pattern: '\*\*v(\d+\.\d+\.\d+) stable\*\*'}
  - {file: ROADMAP.md, pattern: 'текущий канал — \*\*v(\d+\.\d+\.\d+) stable\*\*'}

# Числа в прозе обязаны совпадать с machine-readable claim: README писал «33 гейта», когда claim
# уже говорил 34. Руками набранное число живёт своей жизнью до первого изменения.
derived_numbers_in_docs:
  - {file: README.md, pattern: '\*\*Quality Gates\*\* \| (\d+) гейт', claim: gates_count}

# Каждый claim == фактический status в registry/runtimes.yaml (CI ловит расхождение заявленных
# возможностей адаптеров/оркестратора). Обновлено под 3.8: concurrent + fan-in + resume доказаны live.
runtime_capabilities:
  - {runtime: generic-orchestrator, capability: parallel_execution, status: verified}
  - {runtime: generic-orchestrator, capability: resumability,      status: verified}
  # claude-code — first-class executing adapter (v3.9.0): кит оркестрирует локальный claude -p read-only
  # как сильного writer'а; Claude предлагает, кит владеет worktree/diff/evidence/gates/delivery.
  - {runtime: claude-code, capability: parallel_execution, status: documented}

# ЦЕЛЕВЫЕ границы (не дефекты, объявлены явно): human на strict security #5; сильный writer на сложном
# full-stack. Автономный дешёвый auto-close security-судья недостижим -> future_opportunities (см. BQP).
standing_boundaries:
  - human_strict_security_5
  - strong_writer_for_complex_fullstack
  # v3.34: `validation` из колеса УШЁЛ — переехал в ai_ops_kit/validation/. Остался ОДИН родовой
  # top-level: `tools`. В любом окружении, куда поставлен кит, чужой `import tools` резолвится в
  # него — это конфликт имён, и он объявлен границей ОСОЗНАННО. Убирать его тем же способом рано:
  # сначала надо решить, должен ли `tools` вообще быть Python-пакетом или остаться набором точек
  # входа для скриптов и документации child. Ратчет на состав top-level имён —
  # tests/unit/test_distribution_surface.py: новое родовое имя молча не появится, а это — сократится
  # только осознанно, вместе с тестом.
  - generic_toplevel_name_tools
  # v3.33.3: остаточный `.pth`-пояс, который `setup.py` писал в site-packages до v3.33.1, НЕ
  # снимается ни `pip uninstall`, ни установкой/обновлением кита — и это решение, а не недоделка.
  #   pip не может: файла нет в RECORD установки (он писался side effect'ом сборки, а не как её
  #     результат), а хука uninstall в pip/PEP 517 не существует вовсе.
  #   installer не должен: молча удалять файлы за пределами своего окружения — тот же дефект, что
  #     и молча их писать, только с обратным знаком. Именно эта вольность и создала пояс.
  # Поэтому лечение — ЯВНОЕ: `ai-ops doctor` находит пояс, называет файл и команду, блокирует
  # вердикт (пояс делает зелёными fail-closed-проверки), а `doctor --remove-path-belt` удаляет по
  # просьбе. Проверка — tests/unit/test_path_hygiene.py, tests/unit/test_installer.py.
  - residual_pth_belt_removed_only_on_explicit_request

# v3.34: ОХВАТ ДОКАЗАТЕЛЬСТВА. «Полный контур зелёный» — заявление без величины: PR #38 сделал его
# на основании ./scripts/check-full.sh, и джоба python39-compat опровергла его в том же релизе.
# Полнота бывает двух разных родов, и путать их значит выдавать частное за общее. Имена ниже —
# словарь, которым обязано пользоваться доказательство релиза; validate_release_claims требует,
# чтобы оба охвата были объявлены, а заявление о полноте называло, какой из них получен.
evidence_scopes:
  full-current-python:
    obtained_by: "./scripts/check-full.sh"
    covers: >
      весь pytest на ОДНОМ интерпретаторе — том, что стоит у запускающего. Это охват разработчика:
      быстрый, локальный, и он ничего не знает о версиях, кроме своей.
    does_not_cover: >
      объявленный пол requires-python, установку в чистое окружение, другие ОС. Ни один дефект
      совместимости здесь не виден в принципе — не потому что их нет, а потому что не с чем сравнить.
  compatibility-matrix:
    obtained_by: "CI: джобы python39-compat, pipeline-e2e (3.9/3.12), clean-install"
    covers: >
      объявленный пол requires-python и установку туда, где нет ни кита, ни pytest, ни PYTHONPATH.
    does_not_cover: >
      полный набор тестов на каждой версии матрицы: на полу гоняются контрактные тесты и e2e,
      а не всё подряд. Охват честнее назвать «пол проверен», чем «матрица покрыта целиком».

