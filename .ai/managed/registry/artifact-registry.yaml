# registry/artifact-registry.yaml — реестр стандартных артефактов Product Operating Layer (PR-4).
#
# ЗАЧЕМ РЕЕСТР, А НЕ ПРОЗА. PR-3 требует, чтобы у каждого подключённого репозитория был стандартный
# Product Operating Layer (`.ai-ops/`), а PR-4 — чтобы состав этого слоя описывался ДАННЫМИ, а не
# зашивался в код bootstrap/валидатора. Иначе повторилась бы старая болезнь модели контуров:
# «обязательные документы» жили бы двумя несверяемыми списками (один в installer, другой в
# валидаторе), и никто не мог бы машинно спросить «какие артефакты обязательны», «где их шаблон»,
# «какой версии» и «кто их обновляет». По этому файлу работает КОД:
#   * загрузчик реестра в `ai_ops_kit/planning/` — читает, проверяет инварианты, считает
#     расхождение реестра с файлами репозитория (шаблоны);
#   * bootstrap (`product-layer-bootstrap`, PR-3) — раскладывает объявленные здесь артефакты;
#   * валидация (`product-layer-validation`, PR-5) — состояние Missing/Invalid/Outdated/Valid.
# Поэтому это реестр, а не документация: расхождение реестра с реальностью КРАСНЕЕТ тестом.
#
# ГЛАВНЫЙ ИНВАРИАНТ. Реестр — ЕДИНСТВЕННЫЙ источник истины ФОРМЫ артефакта. Ленты 3–5 регистрируют
# свои артефакты здесь через PR, а не заводят второй реестр (иначе «две правды об одном артефакте»).
# ВЕДЕНИЕ артефакта (наполнение ROADMAP/DELIVERY логикой) — забота других лент; здесь только форма.
#
# ССЫЛОЧНАЯ ЦЕЛОСТНОСТЬ. `owner_role` и `source_contour` каждого артефакта обязаны существовать в
# `registry/product-operating-model.yaml` (роли и контуры). Роль/контур, переименованные там без
# правки здесь, — расхождение реестра с реальностью, и оно обязано краснеть.
schema_version: 1
registry_type: artifact-registry
contract_version: 1

# Корень стандартизированного слоя в ДОЧЕРНЕМ репозитории (PR-3). Все пути артефактов — под ним.
# Путь артефакта относителен корня репозитория; кит пишет и читает здесь, а не в корне продукта,
# чтобы managed-слой кита не смешивался с правдой репозитория.
layer_root: ".ai-ops/"

# ── Уровни автономии AI-действий (PR-19) ────────────────────────────────────────────────────────
# `suggest`  — предложить, не трогая файл;      `prepare` — подготовить черновик/PR к ревью;
# `execute`  — выполнить без подтверждения;      `require_approval` — только с явным подтверждением.
# Значение `autonomy` каждого `ai_actions[]` обязано быть из этого списка (проверяется).
autonomy_levels: [suggest, prepare, execute, require_approval]

# ── Жизненный цикл состояния артефакта (PR-5) ───────────────────────────────────────────────────
# ЧЕТЫРЕ СОСТОЯНИЯ, А НЕ ДВА. `is_file()` != «заполнен»: артефакт может лежать на диске и при этом
# быть пустым (Invalid) или отставшим от кода (Outdated). Порядок — лестница ухудшения; валидация
# (PR-5) обязана различать все четыре, а не сворачивать «есть/нет».
# Отдельно от `artifact_states` модели контуров (то — про доверие к реконструкции, восемь состояний,
# включая CONFLICTING — источники спорят); здесь — про пригодность конкретного документа слоя, четыре состояния.
lifecycle_states:
  - {id: missing,  order: 0, means: "артефакта нет на объявленном пути"}
  - {id: invalid,  order: 1, means: "артефакт есть, но структура/обязательные поля нарушены"}
  - {id: outdated, order: 2, means: "артефакт валиден, но отстал: версия шаблона старее или данные устарели"}
  - {id: valid,    order: 3, means: "артефакт есть, структура полна, версия и данные актуальны"}

# ── Ярусы обязательности артефактов (#609) ──────────────────────────────────────────────────────
# ЯВНАЯ ТАКСОНОМИЯ ПОВЕРХ КОНТУРОВ. Контуры (product-operating-model) отвечают на вопрос «где живёт
# правда», `gap_tiers` — «насколько срочно достроить пробел». Ни то, ни другое не отвечает на вопрос
# «какой стандарт репозитория применим ЗДЕСЬ»: библиотеке не нужен runbook инцидента, а AI-native
# репозиторию он нужен раньше, чем первый релиз. Ярусы — этот недостающий ответ: набор обязательных
# артефактов зависит не от одного продукта, а от КЛАССА репозитория, и класс выбирает профиль дочки.
# Замкнутый словарь: `tier` каждого элемента `standard_catalog` обязан быть отсюда (проверяется).
# `applies_when` — условие, при котором ярус применим (always | production | ai_native).
obligation_tiers:
  - id: tier1
    title: Base
    applies_when: always
    means: "обязателен всегда, независимо от зрелости и типа репозитория"
  - id: tier2
    title: Production
    applies_when: production
    means: "обязателен, когда продукт выходит в production (есть окружение prod или релизы наружу)"
  - id: tier3
    title: AI-native
    applies_when: ai_native
    means: "обязателен для AI-native репозитория: код пишут и/или исполняют AI-агенты"

# ── Профили: какой набор ярусов применим к дочке (#609) ─────────────────────────────────────────
# Профиль дочки (`.ai-ops.yaml -> standard.profile`; по умолчанию — `default_profile` из
# registry/standard.yaml) ВЫБИРАЕТ применимые ярусы. Так один стандарт обслуживает разные классы
# репозиториев без «трёх стандартов по три версии»: состав ярусов общий, различается только их
# применимость. `ai-product` (default) — AI-native продукт в production, все три яруса. Остальные
# профили предобъявлены ДАННЫМИ и активируются, когда дочка их выберет, а не вводятся кодом.
# `includes_tiers` каждого профиля обязан ссылаться на существующие ярусы (проверяется).
profiles:
  ai-product:
    means: "AI-native продукт в production — применимы все три яруса"
    includes_tiers: [tier1, tier2, tier3]
  service:
    means: "production-сервис без AI-разработчиков в контуре — базовый и production-ярусы"
    includes_tiers: [tier1, tier2]
  library:
    means: "библиотека или инструмент без выката в production — только базовый ярус"
    includes_tiers: [tier1]

# ── Артефакты Product Operating Layer ───────────────────────────────────────────────────────────
# Поля каждого артефакта (PR-4):
#   id / title / purpose      — идентификатор, название, назначение;
#   required                  — обязательность (bool): без обязательного слой неполон;
#   kind / format             — document|config|directory  /  markdown|yaml|dir;
#   path                      — путь в репозитории (под layer_root);
#   template                  — {path, version}: официальный шаблон и его версия (PR-5). Для
#                               directory отсутствует;
#   owner_role                — роль-владелец из product-operating-model.yaml (РОЛЬ, не исполнитель);
#   source_contour            — контур, которому артефакт принадлежит (из той же модели);
#   structure                 — required_sections (markdown) | required_fields (yaml): что обязано
#                               присутствовать; проверяет PR-5 (validation), не этот срез;
#   validation                — какие правила применяются при проверке содержимого;
#   update                    — правила обновления: mode (auto|ai_assisted|human), regenerate, on;
#   source                    — источник ДАННЫХ для наполнения (откуда кит берёт содержимое);
#   ai_actions                — что AI Ops вправе делать с артефактом и с какой автономией (PR-19).
#   ai_check                  — ЧТО ПРОВЕРЯЕТ AI-АГЕНТ по этому артефакту (#609): контракт между
#                               репозиторием и AI-разработчиком рядом с required_sections (SR-5).
#                               Не «есть ли файл» (это lifecycle), а какое утверждение о продукте
#                               артефакт обязан держать истинным. Обязателен у required-артефактов.
artifacts:
  - id: product_passport
    title: Product Passport
    purpose: >-
      Паспорт продукта: единая карточка состояния — что за продукт, для кого, зрелость, здоровье,
      текущий milestone, прогресс, риски, зависимости. Генерируется из ФАКТИЧЕСКОГО состояния репо.
    required: true
    kind: document
    format: markdown
    path: ".ai-ops/PRODUCT_PASSPORT.md"
    template: {path: "templates/product-layer/PRODUCT_PASSPORT.md", version: 1}
    owner_role: product
    source_contour: product_strategy
    structure:
      required_sections:
        - Название и описание
        - Аудитория и проблема
        - Repository и окружения
        - Owner и команда
        - Статус и зрелость
        - Здоровье (продукт / технологии / delivery)
        - Версия и последний релиз
        - Текущий milestone и прогресс
        - Риски и зависимости
    validation: [sections_present, non_empty_sections, template_version_current, freshness]
    ai_check: >-
      Факты паспорта не отстали от репозитория: версия и последний релиз совпадают с VERSION и
      CHANGELOG; текущий milestone и прогресс сходятся с delivery-планом; перечисленные риски ещё
      открыты, а не закрыты давно.
    update: {mode: ai_assisted, regenerate: true, on: [release, milestone_change, weekly_audit]}
    source: [repo_state, delivery_plan, product_health, git_history]
    ai_actions:
      - {action: generate, autonomy: prepare}       # черновик из состояния репо -> ревью владельца
      - {action: update,   autonomy: execute}        # актуализация фактов (версия, прогресс)
      - {action: migrate,  autonomy: require_approval}

  # roadmap СНЯТ из этого слоя (SR-2, свод к одному источнику). Направление продукта — обязательный
  # артефакт контура product_strategy в registry/product-operating-model.yaml по каноническому пути
  # `ROADMAP.md` в корне (declared-or-root). Прежде он дублировался здесь как `.ai-ops/ROADMAP.md` с
  # другим шаблоном/горизонтами/валидаторами — две правды об одном направлении (validate_own_medicine
  # прямо называл это дублем). Читатели теперь идут через roadmap.resolve_roadmap_path; уходящий путь
  # мигрируется в корень при установке/обновлении (_migrate_legacy_roadmap).

  - id: delivery
    title: Delivery
    purpose: >-
      Состояние поставки: как код превращается в релиз и что после релиза живо. Форма — здесь;
      наполнение delivery-планом и прогнозом — забота ленты delivery.
    required: true
    kind: document
    format: markdown
    path: ".ai-ops/DELIVERY.md"
    template: {path: "templates/product-layer/DELIVERY.md", version: 1}
    owner_role: delivery
    source_contour: delivery_operations
    structure:
      required_sections: [Текущий milestone, Ближайшие релизы, Блокеры, Delivery health]
    validation: [sections_present, template_version_current, freshness]
    ai_check: >-
      Витрина поставки сходится с фактом: заявленный milestone совпадает с планом; перечисленные
      блокеры ещё не закрыты; delivery health выведен из состояния CI и релизов, а не вписан вручную.
    update: {mode: ai_assisted, regenerate: true, on: [pr_merged, release, weekly_audit]}
    source: [delivery_plan, ci_state, release_history]
    ai_actions:
      - {action: generate, autonomy: prepare}
      - {action: update,   autonomy: execute}
      - {action: migrate,  autonomy: require_approval}

  - id: policy
    title: Policy
    purpose: >-
      Политика допустимого поведения AI Ops в этом репозитории (PR-19): что кит вправе делать сам,
      что готовит к ревью, где обязан остановиться. Исполняемая часть, не проза.
    required: true
    kind: config
    format: yaml
    path: ".ai-ops/POLICY.yaml"
    template: {path: "templates/product-layer/POLICY.yaml", version: 2}
    owner_role: engineer
    source_contour: engineering_quality_security
    structure:
      required_fields: [schema_version, autonomy, protected_paths, approvals]
    validation: [fields_present, autonomy_values_known, template_version_current]
    ai_check: >-
      Границы автономии в POLICY.yaml не шире, чем разрешает .ai-ops.yaml; каждый protected_path
      указывает на существующий путь; объявленные уровни автономии — из известного словаря.
    update: {mode: human, regenerate: false, on: []}
    source: [human, ai_ops_yaml]
    ai_actions:
      - {action: generate, autonomy: prepare}        # черновик из .ai-ops.yaml; правила — за человеком
      - {action: update,   autonomy: require_approval}
      - {action: migrate,  autonomy: require_approval}

  - id: templates_dir
    title: Templates directory
    purpose: >-
      Каталог официальных шаблонов слоя в дочернем репозитории: копия версий шаблонов, по которым
      кит определяет Outdated и проводит миграцию. Структурный артефакт, без собственного шаблона.
    required: true
    kind: directory
    format: dir
    path: ".ai-ops/templates/"
    owner_role: engineer
    source_contour: engineering_quality_security
    validation: [directory_present]
    ai_check: >-
      Зеркало шаблонов не отстало от кита: версии файлов в .ai-ops/templates/ совпадают с версиями
      в реестре — иначе Outdated не отличить от Valid и миграция разложит не ту версию.
    update: {mode: auto, regenerate: true, on: [kit_update]}
    source: [kit_templates]
    ai_actions:
      - {action: generate, autonomy: execute}        # раскладка шаблонов — механическая, из кита
      - {action: update,   autonomy: execute}

# ── Каталог стандарта репозитория по ярусам (#609) ──────────────────────────────────────────────
# ТАКСОНОМИЯ ОБЯЗАТЕЛЬНОСТИ КАК ДАННЫЕ, А НЕ ПЯТОЕ ДЕРЕВО. Каталог не заводит собственных копий
# артефактов (SR-2): где артефакт уже описан реестром, элемент каталога ССЫЛАЕТСЯ на него и лишь
# приписывает ярус и AI-check; где артефакта в реестрах ещё нет — объявляет канонический путь.
# Большинство Tier-2/3 у кита УЖЕ есть шаблонами (ADR, Runbook, SecurityReview, TestPlan,
# AIFeatureEvalPlan, GoldenDataset, AgentTemplate) — здесь они поднимаются до ЯРУСНО обязательных,
# а не заводятся с нуля.
#
# Локатор элемента — РОВНО ОДИН из трёх (проверяется):
#   ref     — id артефакта в `artifacts` этого реестра (форма и секции живут там);
#   contour — id контура в product-operating-model.yaml (правда артефакта — в его source_of_truth);
#   path    — канонический путь в дочернем репозитории для ещё не зарегистрированного артефакта.
# Присутствие и секции ярусно-обязательного артефакта проверяются ТЕМ ЖЕ механизмом, что и у цели
# ссылки: элемент с `ref`/`contour` наследует проверки artifact-registry/контура, элемент с `path`
# объявляет ожидание стандарта. `ai_check` обязателен у каждого элемента (#609, п. 2).
standard_catalog:
  # ── Tier 1 — всегда ──
  - {id: readme,        name: README,        tier: tier1, path: README.md,
     ai_check: "Есть назначение продукта и способ запуска; это не пустой плейсхолдер шаблона."}
  - {id: architecture,  name: ARCHITECTURE,  tier: tier1, contour: system_architecture,
     ai_check: "ARCHITECTURE.md отражает фактический состав системы: перечисленные компоненты существуют в дереве, разделы Components/Data Flows не отстали от кода."}
  - {id: security,      name: SECURITY,      tier: tier1, path: SECURITY.md,
     ai_check: "SECURITY.md описывает АРХИТЕКТУРУ безопасности продукта: объявлены границы доверия/модель угроз, аутентификация, авторизация и классификация данных (для AI-продукта — и защиты вокруг модели). Разделы отражают реальные защиты в коде, а не общие слова; неприменимое помечено явно. Проверять по СМЫСЛУ и по связанным файлам (документам, на которые SECURITY.md ссылается), а не по точным заголовкам."}
  - {id: security_policy, name: SECURITY POLICY, tier: tier1, path: security/security-policy.md,
     ai_check: "Внешняя политика раскрытия: объявлены канал приёма уязвимостей и поддерживаемые версии; путь раскрытия ведёт к живому адресату. Засчитывать содержимое под любыми разумными заголовками и в файле, на который ссылается корневой SECURITY.md, — по смыслу, не по точным названиям разделов."}
  - {id: contributing,  name: CONTRIBUTING,  tier: tier1, path: CONTRIBUTING.md,
     ai_check: "Описан процесс изменения: как запустить проверки и что обязано пройти до merge — команды совпадают с реальными в репозитории."}
  - {id: codeowners,    name: CODEOWNERS,    tier: tier1, path: CODEOWNERS,
     ai_check: "Каждый шаблон путей соответствует существующим путям; на защищённые зоны назначены владельцы."}
  - {id: ci,            name: CI,            tier: tier1, contour: delivery_operations,
     ai_check: "Конвейер запускает объявленные обязательные проверки; обязательная джоба качества присутствует и не отключена."}
  - {id: testing,       name: TESTING,       tier: tier1, contour: engineering_quality_security,
     ai_check: "Описана тестовая стратегия и команда запуска; заявленный способ прогонов существует в репозитории."}
  - {id: adr,           name: ADR,           tier: tier1, contour: research_decisions,
     ai_check: "Значимые решения записаны как ADR; решение, видимое в истории кода, имеет соответствующую запись."}
  # ── Tier 2 — для production ──
  - {id: operations,    name: OPERATIONS,    tier: tier2, path: docs/OPERATIONS.md,
     ai_check: "Описаны эксплуатационные процедуры; названные сервисы и окружения существуют."}
  - {id: threat_model,  name: THREAT_MODEL,  tier: tier2, path: security/THREAT_MODEL.md,
     ai_check: "Перечислены активы, границы доверия и угрозы; для каждой угрозы есть мера или явно принятый риск."}
  - {id: deployment,    name: DEPLOYMENT,    tier: tier2, path: docs/DEPLOYMENT.md,
     ai_check: "Шаги выката соответствуют CI и деплой-конфигам; окружения совпадают с объявленными."}
  - {id: runbooks,      name: RUNBOOKS,      tier: tier2, contour: delivery_operations,
     ai_check: "Для типовых инцидентов есть исполнимый runbook; шаги ссылаются на существующие команды и дашборды."}
  - {id: changelog,     name: CHANGELOG,     tier: tier2, contour: delivery_operations,
     ai_check: "Есть раздел под текущую версию; версия совпадает с VERSION и последним релизом."}
  - {id: dr,            name: DR,            tier: tier2, path: docs/DR.md,
     ai_check: "Объявлены RPO/RTO и процедура восстановления; названные резервные копии и хранилища существуют."}
  - {id: observability, name: OBSERVABILITY, tier: tier2, path: docs/OBSERVABILITY.md,
     ai_check: "Объявлены метрики, логи и алерты; названные сигналы соответствуют трекингу в коде."}
  # ── Tier 3 — для AI-native ──
  - {id: agents,        name: AGENTS.md,     tier: tier3, path: AGENTS.md,
     ai_check: "Инструкции агенту соответствуют репозиторию: команды проверок, карта каталогов и инварианты не устарели."}
