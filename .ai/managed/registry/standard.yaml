# registry/standard.yaml — стандарт репозитория как ВЕРСИОНИРУЕМЫЙ объект (SR-1..4).
#
# ЗАЧЕМ ОТДЕЛЬНАЯ ВЕРСИЯ. Версия стандарта и версия пакета были одним числом, поэтому любой патч
# кита выглядел как изменение требований к репозиторию, а «Child A на стандарте 1, Child B на 2»
# сказать было нечем. `standard_version` растёт ТОЛЬКО при изменении требований к репозиторию:
# новый обязательный артефакт, новая обязательная секция, изменение силы проверки (SR-1).
#
# ЭТО МАНИФЕСТ-ССЫЛКА, НЕ ВТОРОЙ СПИСОК (SR-2). Состав требований живёт в существующих реестрах;
# здесь — только версия, отпечаток и указатели, ОТКУДА состав читается. Код (`ai_ops_kit/planning/
# standard.py`) собирает состав из этих источников и считает отпечаток; тест краснеет, если состав
# изменился, а `standard_version`/`requirements_fingerprint` — нет (ратчет, как footprint/layering).
schema_version: 1
registry_type: standard

# Версия стандарта. Патч-релиз кита её НЕ меняет. Растёт только при изменении требований к репозиторию.
# v2 (#609): введена ярусная таксономия обязательности (Tier 1/2/3) и каталог стандарта по ярусам —
# новые обязательные артефакты в поверхности стандарта требуют роста версии (SR-1).
# v4 (#692): в каталог добавлен tier3-артефакт issue_template — единый стиль оформления issue
# (заголовок-исход + секции Что/Зачем/Проверяемо/Границы). Advisory-культура, не блокирующий гейт.
# v5 (#746): сила гейта feature_decision_quality поднята advisory → blocking (ENFORCE). Это изменение
# check_strength — часть версионируемой поверхности стандарта: дочка вправе знать, что фича-цель без
# измеримого обязательства теперь блокирует прогон, а не только предупреждает.
# v6 (#826): SECURITY.md добавлен в required_repo_artifacts — новый обязательный артефакт репозитория
# (путь раскрытия уязвимостей, статья SEC-001 Архитектурной конституции). Теперь он детерминированно
# сидируется черновиком, проверяется doctor'ом и own-medicine, а не только judge-проверкой каталога.
# v7: безопасность разведена на ДВА обязательных артефакта. `SECURITY.md` (корень) теперь описывает
# АРХИТЕКТУРУ безопасности (модель угроз, вход, права, классификация данных, защиты AI) — статья
# SEC-008; внешний путь раскрытия переехал в `security/security-policy.md` — статья SEC-001. Оба
# обязательны у всех дочек, сидируются черновиками, проверяются по СМЫСЛУ и по связке файлов.
# v8: в реестр гейтов добавлен гейт `feature_coverage` (W3, тогда advisory) — состав проверок дочки
# изменился, значит версионируемая поверхность стандарта выросла (ратчет SR-1).
# v9: сила гейта `feature_coverage` поднята advisory → blocking (W4). Построен внешний путь
# enforcement (доставленный child-CI `ai-ops-feature-coverage`), и незадокументированная
# verified-поверхность теперь БЛОКИРУЕТ прогон дочки, а не только предупреждает. Повышение силы
# проверки до блокирующей — часть версионируемой поверхности стандарта (SR-1, тот же класс, что v5).
standard_version: 9

# Отпечаток состава требований (sha256[:16] от required_artifacts + required_sections + сила гейтов,
# считанных из источников ниже). Меняется состав — обязаны измениться отпечаток и standard_version.
requirements_fingerprint: "7b4f618f466f6ff6"

# Откуда читается состав (SR-2: ссылки на реестры, а не дубль):
sources:
  required_artifacts:
    - "registry/product-operating-model.yaml: contours[].source_of_truth[] c required: true"
    - "registry/artifact-registry.yaml: artifacts[] c required: true"
    - "registry/artifact-registry.yaml: standard_catalog[] с ярусом, применимым к default_profile (#609)"
    - "manifest/ai-ops-manifest.yaml: living_status.required_context_docs + product_operating_model.required_repo_artifacts"
  required_sections:
    - "registry/product-operating-model.yaml: source_of_truth[].required_sections"
    - "registry/artifact-registry.yaml: artifacts[].structure.required_sections"
  check_strength:
    - "quality/gates.yaml: gates[].blocking"

# Профиль по умолчанию для дочки (SR-4). Профиль ВЫБИРАЕТ применимые ярусы обязательности
# (#609): состав ярусов и их применимость объявлены в registry/artifact-registry.yaml -> profiles.
# `ai-product` включает все три яруса (Tier 1/2/3). Отпечаток стандарта считается по каталогу этого
# профиля — смена default_profile меняет поверхность требований.
default_profile: ai-product

# Что считается ломающим изменением стандарта (docs/engineering-standard-requirements.md §6):
#   новый обязательный артефакт; новая обязательная секция; новый инвариант по умолчанию; повышение
#   силы проверки до блокирующей; удаление/переименование объявленного инварианта.
