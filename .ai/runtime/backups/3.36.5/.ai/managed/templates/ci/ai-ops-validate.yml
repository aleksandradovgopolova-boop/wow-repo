# ai-ops-validate.yml — child-CI: валидация установки AI Ops без protected-пина.
# Ставится `ai-ops init` в .github/workflows/ (или скопируйте вручную).
#
# Пин версии kit = installed_version из .ai-ops.yaml (НЕ хардкод в отдельной строке
# protected-файла). Один источник версии, который и так едет через PR обновления
# (update_policy: pr, .ai-ops.yaml — не protected). Клонируем kit по тегу
# v<installed_version> и прогоняем child-валидатор.
#
# Почему так (findings обкатки v2.34): раньше пин жил отдельной строкой в protected
# ci.yml -> каждое `ai-ops update` требовало ручной правки protected-файла ради одной
# строки. Избыточная защита: пин и так меняется в .ai-ops.yaml при апдейте. Убираем
# трение, версия — из единственного источника.
#
# Требует, чтобы релизы kit были тегированы (v2.34.0 и т.п.) — release.yml это делает.
name: ai-ops-validate
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    # Раннер выбирается ПЕРЕМЕННОЙ, а не зашит. `ubuntu-latest` существует только у
    # GitHub: в организации со своими раннерами джоба с этим ярлыком просто висит в
    # очереди и никогда не стартует. Задайте `vars.CI_RUNNER_LINUX` (Settings ->
    # Secrets and variables -> Actions -> Variables) — и кит поедет на вашей машине.
    # Обкатано на живом self-hosted стенде ии-среды, а не придумано.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # Python ставим ТОЛЬКО на раннерах GitHub. На своей машине `setup-python` уходит в
      # tool cache по пути раннеров GitHub (`/Users/runner`), которого там нет, а `pip install`
      # в системный python Ubuntu 24.04 запрещён (PEP 668, externally-managed-environment).
      - uses: actions/setup-python@v5
        if: ${{ !vars.CI_RUNNER_LINUX }}
        with: {python-version: "3.12"}
      - run: pip install pyyaml
        if: ${{ !vars.CI_RUNNER_LINUX }}
      # На своём раннере предустановку не молчим, а ПРОВЕРЯЕМ: иначе первое падение случится
      # глубже и невнятнее — так у ии-среды `net::ERR_CONNECTION_REFUSED` прятал отсутствие
      # утилиты. Здесь причина названа сразу.
      - name: Проверить python и pyyaml (свой раннер)
        if: ${{ vars.CI_RUNNER_LINUX }}
        run: |
          python3 -c 'import sys, yaml; print("python", sys.version.split()[0], "· pyyaml", yaml.__version__)' \
            || { echo "на раннере '${{ vars.CI_RUNNER_LINUX }}' нет python3 с pyyaml — поставьте их на машину раннера (кит ставить их в системный python не будет: PEP 668)"; exit 1; }
      - name: Клонировать kit на пин = installed_version (.ai-ops.yaml)
        run: |
          SRC=$(python3 -c "import yaml;s=yaml.safe_load(open('.ai-ops.yaml'))['parent']['source'];print(s[4:] if s.startswith('git+') else s)")
          VER=$(python3 -c "import yaml;print(yaml.safe_load(open('.ai-ops.yaml'))['parent']['installed_version'])")
          echo "kit pin = v$VER (из .ai-ops.yaml, не protected)"
          # Клон в $RUNNER_TEMP, а НЕ в /tmp: свой раннер не одноразовый, /tmp живёт между
          # прогонами, и клон падал на «destination path already exists». $RUNNER_TEMP раннер
          # чистит на каждую джобу — и на своей машине, и на раннерах GitHub.
          git clone --depth 1 --branch "v$VER" "$SRC" "$RUNNER_TEMP/ai-ops-kit" \
            || { echo "не удалось клонировать kit v$VER из $SRC — нет тега v$VER, нет доступа к репозиторию или каталог занят (причина в выводе git выше)"; exit 1; }
      - name: Child-валидатор (версии согласованы, managed-слой цел)
        # Путь `ai_ops_kit/validation/…`, а НЕ корневой `validation/`: каталог переехал в 3.34, а
        # шаблон остался на старом пути — каждый child, установленный с 3.34, получал workflow,
        # который падает на «No such file». Кит был зелёным: `clean-install` проверял установку, но
        # не ИСПОЛНЯЛ тот CI, который установка отдаёт ребёнку. Теперь исполняет
        # (tests/unit/test_child_ci_template.py) — иначе следующий переезд повторит это молча.
        run: python3 "$RUNNER_TEMP"/ai-ops-kit/ai_ops_kit/validation/validate_ai_ops_child.py
