# POLICY.yaml — политика допустимого поведения AI Ops в этом репозитории (артефакт `policy`, PR-19).
# Официальный шаблон v1. Поля ниже — ОБЯЗАТЕЛЬНЫЕ (проверяет машина). Это ИСПОЛНЯЕМАЯ часть контракта:
# кит спрашивает её перед действием, а не читает как прозу. Правила здесь за человеком (mode: human);
# кит вправе подготовить черновик, но не менять политику молча. Экземпляр в дочке — `.ai-ops/POLICY.yaml`.
#
# `template_version` ОБЯЗАТЕЛЕН: по нему кит отличает Outdated от Valid и мигрирует при смене версии.
template_version: 2
schema_version: 1

# Режим принуждения политики (v2). `observe` — кит СЧИТАЕТ и ЗАПИСЫВАЕТ решение политики о доставке,
# но доставку НЕ останавливает (радиус поражения виден заранее); `block` — `require_approval` без
# одобрения человека РЕАЛЬНО блокирует доставку. По умолчанию observe (безопасная сторона). Раньше
# режим жил только в коде и владельцу был не виден — v2 выносит его в шаблон, чтобы его можно было
# осознанно переключить. Значения: observe | block.
enforcement: observe

# Уровень автономии по классам действий (PR-19): suggest | prepare | execute | require_approval.
autonomy:
  update_artifacts: prepare        # обновление продуктовых артефактов слоя
  create_pr: prepare               # создание PR
  merge: require_approval          # слияние — только с подтверждением человека
  change_policy: require_approval   # правка самой политики — всегда через человека

# Пути, которые AI не меняет без ревью владельца. Дополняется под репозиторий.
protected_paths:
  - ".ai-ops/POLICY.yaml"

# Что требует явного подтверждения человека, даже если autonomy выше это допускает.
approvals:
  required_for:
    - удаление данных
    - изменение секретов и доступов
    - деплой в production
