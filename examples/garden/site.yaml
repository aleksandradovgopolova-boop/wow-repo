# Site-level identity for the Garden repository.
# This is the only place Garden names itself to the engine. The engine reads it;
# it contains no layout or styling.
name: Garden
tagline: A space for living, not managing life.
description: >-
  Garden is a personal digital space for rituals, meaningful places, lived
  experiences, and the slow recovery of attention. It is a place to keep a
  careful relationship with your own life.
lang: en

# Audiences Garden is projected for. The repository is written once; each
# audience below is a different projection of that single source.
#   - clearances: which visibility levels this audience may see.
#   - default:    the audience served at the site root ("/"). Others live under
#                 "/<key>". Exactly one audience is the default.
audiences:
  - key: visitor
    label: Visitor
    clearances: [public]
    default: true
  - key: engineer
    label: Engineer
    clearances: [public, internal]
